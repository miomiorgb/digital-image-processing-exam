  <script>window.OFFLINE_MODE=true;</script><script>/* 根据作业题干编写的复习参考答案，非教师提供的标准答案。 */

  {
    id: 2, title: "邻域、邻接与连通", topic: "图像基础",
    en: "Explain Neighbors, Adjacency, Connectivity and the connection between them.",
    zh: "解释邻域、邻接、连通，以及三者之间的联系。",
    cues: [{en:"neighbors",zh:"位置上的邻居"},{en:"adjacency",zh:"一步是否允许连接"},{en:"connectivity",zh:"能否沿路径到达"}],
    intuition: "先确定哪些像素住在附近，再规定哪些像素之间能走一步，最后问能否沿着这些步子从一个像素走到另一个像素。",
    points: [
      {label:"邻域只描述位置",text:"对 p=(x,y)，N₄(p)={(x±1,y),(x,y±1)}；对角邻域 Nᴅ(p)={(x±1,y±1)}；N₈(p)=N₄(p)∪Nᴅ(p)。超出图像边界的位置不计入。",en:"The 4-neighbors share an edge, and the 8-neighbors include both edge-sharing and diagonal neighbors.",aliases:["4邻域","4-neighbors","N4","上下左右","对角","diagonal","8邻域","8-neighbors"]},
      {label:"邻接还要求像素值符合条件",text:"先给定允许的灰度集合 V。p、q 的值均属于 V，且 q∈N₄(p) 时为 4 邻接；q∈N₈(p) 时为 8 邻接。几何上相邻并不自动表示属于同一目标。",en:"Two pixels with values in V are 4-adjacent or 8-adjacent if one lies in the corresponding neighborhood of the other.",aliases:["V","灰度集合","values in","4-adjacent","8-adjacent","邻接"]},
      {label:"m 邻接消除部分对角歧义",text:"m 邻接允许 4 邻接；也允许对角邻接，但此时 N₄(p)∩N₄(q) 中不能有值属于 V 的像素。它限制多余的对角连接。",en:"Mixed adjacency permits diagonal adjacency only when the common 4-neighbors contain no pixel with a value in V.",aliases:["m邻接","mixed","共同4邻域","common 4","交集","∩"]},
      {label:"连通通过路径定义",text:"若存在完全位于集合 S 内、相邻两点均满足指定邻接关系的像素路径，则 p、q 在 S 中连通。所有相互连通的像素构成连通分量。联系：邻域→邻接规则→路径与连通性。",en:"Two pixels are connected if a path of adjacent pixels exists between them within the set; connected pixels form a connected component.",aliases:["路径","path","连通分量","connected component","邻域","邻接"]}
    ],
    trap: "答题先说明 V 和采用的邻接类型。4 连通与 8 连通可能给出不同的连通分量数。m 邻接的条件是公共 4 邻域内没有属于 V 的像素。",
    variants: ["Distinguish pixel neighborhood, adjacency and connectivity.","How is connectivity defined from a chosen pixel adjacency relation?"],

    cloze: {text:"像素是否连通，需要判断集合内是否存在满足指定邻接规则的 ___。",answers:["路径","path","像素路径","pixel path"],explain:"邻接检查一步，连通检查一条由许多合法步子组成的路径。"},
    example:"<p>令 V={1}：<code>1 0 / 0 1</code> 的两个 1 为 8 邻接，也为 m 邻接，但不是 4 邻接。换成 <code>1 1 / 0 1</code> 后，这两个对角的 1 不再 m 邻接，因为公共 4 邻域中已有一个 1；它们仍能沿两步 4 邻接路径连通。</p>"
  },
  {
    id: 3, title: "图像研究的三个层次", topic: "图像基础",
    en: "Explain the three levels of research about image and the relation between them.",
    zh: "解释图像研究的三个层次及相互关系。",
    cues: [{en:"three levels",zh:"处理、分析、理解"},{en:"image processing",zh:"图像输入、图像输出"},{en:"image understanding",zh:"语义与决策"}],

    points: [
      {label:"低层：图像处理",text:"图像处理主要把图像变成另一幅图像，改善质量或使其适合后续处理，例如去噪、增强、复原。输入与输出通常都是图像。",en:"Low-level image processing takes an image as input and usually produces another image, for example by denoising or enhancement.",aliases:["图像处理","image processing","低层","low-level","图像到图像"]},
      {label:"中层：图像分析",text:"图像分析从图像中分割目标、提取和描述特征，得到边界、面积、位置等符号或数值信息。输入通常是图像，输出常是特征或目标描述。",en:"Mid-level image analysis extracts objects and measurable features through segmentation, representation and description.",aliases:["图像分析","image analysis","分割","segmentation","特征","features"]},
      {label:"高层：图像理解",text:"图像理解利用特征、上下文和知识解释目标与场景，形成语义判断或决策，例如理解道路场景、判断行为。",en:"High-level image understanding interprets objects and scenes using features, context and knowledge to support semantic decisions.",aliases:["图像理解","image understanding","语义","semantic","知识","knowledge","决策"]},
      {label:"逐层抽象、相互支撑",text:"低层结果支撑分析，分析结果支撑理解；高层知识也可反馈指导低层处理。三层边界并非绝对，具体任务可能跨层。",en:"The levels move from pixels to features and then to meaning; they support one another and may overlap.",aliases:["像素","pixels","特征","features","语义","meaning","反馈","支撑"]}
    ],
    trap:"不要只背三个名字。每层写清输入、输出及一个例子，才能把层次差异说完整。分类识别在不同教材的层次划分可能略有交叉，按课程术语表述。",
    variants:["Describe low-level, mid-level and high-level image tasks and how they are related.","Compare image processing, image analysis and image understanding with examples."],

    cloze:{text:"图像研究从像素级处理，经过特征分析，逐步走向场景的 ___ 理解。",answers:["语义","semantic","含义","意义"],explain:"高层研究关心目标是什么、场景表示什么以及应作何判断。"},
    example:"<p>医学图像：去噪（处理）→分割器官并测面积（分析）→结合医学知识解释病变（理解）。层次的关键是信息表达逐渐抽象。</p>"
  },
  {
    id:4,title:"直方图的定义与用途",topic:"灰度与直方图",
    en:"Explain the histogram and the value of it.",zh:"解释图像直方图及其用途。",
    cues:[{en:"histogram",zh:"每个灰度出现多少次"},{en:"normalized histogram",zh:"灰度概率分布"},{en:"value",zh:"用途与价值"}],

      {label:"归一化定义",text:"若图像尺寸为 M×N，p(rₖ)=nₖ/(MN)，所有 p(rₖ) 之和为 1，可看作灰度概率的估计。",en:"The normalized histogram p(r_k)=n_k/(MN) estimates the gray-level probability distribution and sums to one.",aliases:["归一化","normalized","概率","probability","MN","和为1"]},
      {label:"用途",text:"直方图帮助判断整体亮度、对比度与动态范围，并用于直方图均衡化、规定化和阈值分割。灰度集中在低端通常偏暗，分布较窄通常对比度较低。",en:"Histograms help assess brightness and contrast and support equalization, matching and threshold-based segmentation.",aliases:["亮度","brightness","对比度","contrast","均衡","equalization","阈值","threshold"]},
      {label:"空间信息的限制",text:"直方图不保留像素位置。两幅空间结构完全不同的图像可以有相同的直方图，因此单凭直方图不能恢复原图。",en:"A histogram does not retain spatial positions, so different images can share the same histogram.",aliases:["空间","spatial","位置","position","相同直方图","same histogram"]}

  {
    id:5,title:"采样、量化与分辨率",topic:"图像基础",
    en:"Explain the sampling, quantization, spatial resolution, gray resolution and the relationship with the image quality.",
    zh:"解释采样、量化、空间分辨率、灰度分辨率与图像质量的关系。",
    cues:[{en:"sampling",zh:"坐标离散化"},{en:"quantization",zh:"幅值离散化"},{en:"spatial / gray resolution",zh:"位置细节 / 亮度细节"}],
    intuition:"用多少个位置去记录画面，是采样问题；每个位置允许记录多少种亮度，是量化问题。",

      {label:"量化",text:"量化把连续强度映射到有限个离散灰度级。若每像素使用 b 位，则通常有 L=2ᵇ 个可表示灰度级。",en:"Quantization digitizes intensity amplitudes into L levels; b bits can represent L=2^b levels.",aliases:["量化","quantization","强度","intensity","幅值","amplitude","2^b","2ᵇ"]},
      {label:"两种分辨率",text:"空间分辨率表示分辨细小空间结构的能力，受到采样间隔、成像光学等因素限制；灰度分辨率表示分辨细小强度差异的能力，与灰度级数、位深及噪声有关。",en:"Spatial resolution concerns fine spatial detail, whereas gray-level resolution concerns small intensity differences.",aliases:["空间分辨率","spatial resolution","灰度分辨率","gray-level resolution","位深","bit depth"]},
      {label:"质量与代价",text:"采样过稀会丢失细节或产生混叠；灰度级过少会引起量化误差和假轮廓。增加像素数或位深通常增加存储，但不能单独消除光学模糊或噪声。",en:"Insufficient sampling may cause aliasing, while coarse quantization may cause false contours; higher resolution also increases storage.",aliases:["混叠","aliasing","假轮廓","false contours","量化误差","quantization error","存储","storage"]}
    ],
    trap:"像素更多不等于必然更清晰：同样的模糊图像插值放大并不能创造已丢失的真实细节。照片上此题号有划改，平台将其作为可选补充题。",
    variants:["Distinguish spatial sampling from intensity quantization and explain their effects.","How do spatial resolution and gray-level resolution influence a digital image?"],
    quiz:{prompt:"把一幅图的灰度级从 256 级降到 4 级，但保持像素网格不变，主要改变什么？",options:["量化及灰度分辨率","采样间隔","视场大小","物体的真实尺寸"],answer:0,explain:"位置没变，允许的亮度级减少，因此改变的是量化精细程度与灰度分辨率。"},

  },
  {
    id:6,title:"同时对比与马赫带",topic:"图像基础",
    en:"Explain the Simultaneous Contrast and Mach band effect.",zh:"解释同时对比与马赫带效应。",
    cues:[{en:"simultaneous contrast",zh:"同灰度、不同背景、不同感受"},{en:"Mach bands",zh:"边界附近的假亮带和假暗带"}],
    intuition:"眼睛感受到的亮度受周围区域影响，因此显示数值相同的两个灰块，看上去也可能不一样。",
    points:[
      {label:"同时对比",text:"相同物理灰度的小块放在不同亮度背景上，会呈现不同的感知亮度：暗背景上的灰块通常显得更亮，亮背景上的灰块通常显得更暗。",en:"In simultaneous contrast, identical gray patches appear brighter on a dark background and darker on a bright background.",aliases:["同时对比","simultaneous contrast","背景","background","相同灰度","identical"]},
      {label:"马赫带",text:"在明暗区域的过渡附近，人眼会感到亮侧更亮、暗侧更暗，产生实际灰度分布中不存在的亮带或暗带。",en:"Mach bands are perceived bright and dark bands near intensity transitions, even when those bands are absent from the actual intensity profile.",aliases:["马赫带","Mach","边界","transition","亮带","暗带"]},
      {label:"共同意义与区别",text:"两者说明视觉亮度不是像素强度的简单直接读出，而受到局部空间对比影响。前者强调背景影响目标亮度，后者强调过渡附近的对比增强。",en:"Both effects show that perceived brightness depends on local context; simultaneous contrast emphasizes background effects, while Mach bands emphasize transitions.",aliases:["感知","perceived","局部","local","对比","contrast","背景","过渡"]}

    zh:"计算 P(3,4) 与 Q(8,10) 的 D₄、D₈ 与欧氏距离。",
    cues:[{en:"D4 / city-block",zh:"横纵差相加"},{en:"D8 / chessboard",zh:"坐标差取最大"},{en:"Euclidean distance",zh:"勾股定理"}],
    intuition:"只能横竖走时像走街区；允许斜走时像国际象棋中的王；欧氏距离则是直接连线的长度。",
    points:[
      {label:"先求坐标差",text:"Δx=|8−3|=5，Δy=|10−4|=6。把两个非负差写出来，再代公式。",en:"The absolute coordinate differences are |Δx|=5 and |Δy|=6.",aliases:["5","6","坐标差","coordinate differences"]},

    cues:[{en:"histogram equalization",zh:"CDF 灰度映射"},{en:"completely flat",zh:"每级概率完全相同"},{en:"discrete",zh:"有限像素与有限灰度"}],
    intuition:"一批相同灰度的像素被整批搬到某个新灰度。单一灰度映射无法把这一批拆开，因此很难让每个新灰度恰好得到一样多的像素。",
    points:[
      {label:"均衡化定义",text:"用输入灰度的累计分布函数构造单调变换，例如 sₖ=round[(L−1)Σⱼ₌₀ᵏp(rⱼ)]，重新分配灰度以扩展有效动态范围，常用于增强全局对比度。",en:"Histogram equalization uses a cumulative-distribution mapping to redistribute intensities and often improve global contrast.",aliases:["累计","CDF","cumulative","映射","mapping","对比度","contrast"]},
      {label:"连续理论与离散实际",text:"在满足条件的连续概率模型中，s=T(r)=CDF(r) 可得到 [0,1] 上的均匀分布。数字图像的灰度和像素数量都离散，且输出需量化，因此不能直接照搬连续结论。",en:"A continuous CDF transform can produce a uniform distribution under suitable assumptions, but digital gray levels and pixel counts are discrete.",aliases:["连续","continuous","离散","discrete","量化","quantization"]},
      {label:"多对一且不能拆分同灰度像素",text:"不同输入灰度可能量化到同一输出灰度，概率发生合并。所有相同输入灰度的像素得到相同输出值，不能通过这一点变换把它们任意拆分到多个输出级。",en:"Quantization merges input levels, and a deterministic gray-level mapping cannot split pixels of the same input level across output levels.",aliases:["多对一","合并","merge","拆分","split","相同灰度","same input"]},
      {label:"结论",text:"输出直方图一般只趋向更展开，不保证每个灰度级像素数相等。有些级可能为空；输入某一级过多时仍会保留明显峰值。",en:"The output histogram is generally more spread out, but it is not guaranteed to be perfectly flat and may contain empty levels.",aliases:["不保证","not guaranteed","空","empty","平坦","flat"]}

    intuition:"九个人收入里有一个极端高值，平均数会被明显拉高，中位数通常变化较小。中值滤波同样能抵抗孤立的异常像素。",
    points:[
      {label:"运算与线性",text:"均值滤波用邻域加权平均，常见算术均值核是线性平滑滤波器；中值滤波把邻域排序后取中间值，是非线性的次序统计滤波器。",en:"A mean filter averages neighborhood values and is linear; a median filter selects the middle sorted value and is nonlinear.",aliases:["平均","average","排序","sort","非线性","nonlinear","线性","linear"]},
      {label:"脉冲噪声",text:"均值容易受极端值影响，并把孤立噪声扩散到周围；中值对少量异常值更稳健，特别适合去除椒盐噪声。前提是窗口没有被噪声大面积占据。",en:"Median filtering is robust to isolated outliers and is especially effective for salt-and-pepper noise.",aliases:["椒盐","salt-and-pepper","脉冲","impulse","异常","outlier","稳健","robust"]},
      {label:"边缘保持",text:"与同样大小的均值窗口相比，中值通常能更好地保持较大的阶跃边缘；均值把边缘两侧的值平均，容易模糊边缘。",en:"Median filtering generally preserves step edges better than mean smoothing, which averages across the boundary.",aliases:["边缘","edge","保持","preserve","模糊","blur"]},
      {label:"适用条件与限制",text:"中值仍可能去掉细线、小目标和细节，不保证对所有噪声都优于均值。对独立同分布的加性高斯噪声，均值也可能更适合；选窗口必须权衡去噪与细节。",en:"Median filtering can remove thin lines and small details, and it is not universally better for all noise types.",aliases:["细线","thin lines","细节","details","高斯","Gaussian","窗口","window"]}

    ],
    example:"<p><strong>新编例题：</strong>原图四角 f(0,0)=10，f(1,0)=20，f(0,1)=30，f(1,1)=40，求 (0.25,0.5)。</p><p>上边：0.75×10+0.25×20=12.5；下边：0.75×30+0.25×40=32.5；再沿 y：0.5×12.5+0.5×32.5=<strong>22.5</strong>。</p><p>最近邻在 y=0.5 发生等距。若约定半整数向较大坐标取整，则取 (0,1)，结果30；若向较小坐标取整则为10。计算前写清规则。</p>",
    trap:"双线性不是不分距离的四点平均。只有 α=β=0.5 时四个权重才都是1/4。也不要把四舍五入像素坐标和最终灰度取整混在一起。",
    variants:["Compute an interpolated pixel using the nearest-neighbor and bilinear methods.","How does a four-neighbor weighted interpolation differ from copying the nearest sample?"],
    quiz:{prompt:"四角灰度为10、20、30、40，在正中心的双线性插值为多少？",options:["10","20","25","40"],answer:2,explain:"正中心 α=β=0.5，四角各占1/4，结果 (10+20+30+40)/4=25。"},
    cloze:{text:"Bilinear interpolation uses ___ surrounding pixels.",answers:["four","4","四","四个"],explain:"题眼是 bilinear ↔ four surrounding pixels ↔ weighted average。"},
    sources:["https://www.mathworks.com/help/matlab/ref/imresize.html"]
  },
  {
    id:21,title:"光与颜料的三原色",topic:"彩色图像",
    en:"What are the three basic colors of light and their complementary colors? What happens when each primary is mixed with its complement? Answer the same questions for pigments.",
    zh:"光与颜料各有哪三原色、对应的互补色？原色与其互补色混合分别得到什么？",
    cues:[{en:"light / additive",zh:"光：RGB，加色"},{en:"pigments / subtractive",zh:"理想颜料：CMY，减色"},{en:"complementary colors",zh:"互补：补齐缺少的成分"}],
    intuition:"发光的屏幕把光加起来，越加越接近白；理想颜料通过吸收光来混色，吸收范围越多，越接近黑。",
    points:[
      {label:"光的三原色",text:"光的加色三原色为红 Red、绿 Green、蓝 Blue，即 RGB。标准化强度下 R+G=黄，G+B=青，B+R=品红。",en:"The additive primaries of light are red, green and blue: RGB.",aliases:["RGB","红绿蓝","red","green","blue"]},
      {label:"光的互补关系",text:"红的互补色是青 Cyan，绿的互补色是品红 Magenta，蓝的互补色是黄 Yellow。适当强度的原色光加上对应互补色光，三通道补齐，得到白光。",en:"Red, green and blue have cyan, magenta and yellow as complements; each primary plus its complement gives white light.",aliases:["青","品红","黄","white","白","cyan"]},
      {label:"理想颜料三原色",text:"印刷的理想减色三原色为青 Cyan、品红 Magenta、黄 Yellow，即 CMY。青主要吸收红，品红主要吸收绿，黄主要吸收蓝。",en:"The ideal subtractive primaries are cyan, magenta and yellow: CMY.",aliases:["CMY","减色","subtractive","吸收"]},
      {label:"颜料互补关系与结果",text:"青的互补色为红，品红的互补色为绿，黄的互补色为蓝。理想减色模型中，原色颜料与对应互补色颜料混合吸收全部三种光，得到黑色；实际油墨常需黑色 K 改善暗部。",en:"The complements of cyan, magenta and yellow are red, green and blue; ideal complementary pigments combine to give black.",aliases:["黑","black","理想","互补"]}
    ],
    trap:"题干若出现 light，要答 RGB、加色、white；出现 pigments，要答理想 CMY、减色、black。不要把绘画中的传统红黄蓝约定代入数字图像教材的 CMY 模型。",
    variants:["Contrast additive RGB mixing with subtractive CMY mixing.","List each primary-complement pair and state the ideal mixing result for light and pigments."],
    quiz:{prompt:"在理想加色模型中，红光的互补色是什么？二者适当混合得到什么？",options:["绿色；黄色","青色；白色","黄色；黑色","品红；蓝色"],answer:1,explain:"青光包含绿与蓝，和红光共同组成 RGB 三个分量，得到白光。"},
    cloze:{text:"In the additive model, a primary color and its complement combine to produce ___ light.",answers:["white","白","白色"],explain:"加色补齐 RGB 得白；减色颜料的理想结果为黑。"}
  },
  {
    id:22,title:"RGB 与 HSI 模型",topic:"彩色图像",
    en:"Try to explain the RGB color model and the HSI color model.",
    zh:"解释 RGB 和 HSI 颜色模型。",
    cues:[{en:"RGB",zh:"Red、Green、Blue，三种光的分量"},{en:"HSI",zh:"Hue、Saturation、Intensity"},{en:"color model",zh:"用哪些坐标描述同一种颜色"}],
    intuition:"RGB 像调屏幕的三盏灯；HSI 像描述‘什么颜色、有多鲜艳、有多亮’，更接近人的语言。两者可以表示同一个像素，只是坐标不同。",
    points:[
      {label:"RGB",text:"RGB 用红、绿、蓝三个加色分量描述颜色，常用立方体表示。归一化时每个分量在[0,1]，(0,0,0)为黑、(1,1,1)为白，R=G=B 是灰度轴。",en:"RGB represents a color by red, green and blue components in an additive color cube.",aliases:["红绿蓝","additive","cube","三分量","RGB"]},
      {label:"HSI 三个分量",text:"H 色调表示颜色类别，可用角度表示；S 饱和度表示掺入白色的程度，越低越接近灰；I 强度表示亮度成分。它们分别回答什么颜色、多纯、多亮。",en:"HSI describes hue, saturation and intensity, corresponding to color type, purity and brightness.",aliases:["hue","saturation","intensity","色调","饱和度","强度"]},
      {label:"常用强度与饱和度公式",text:"对非负 RGB，常见 HSI 定义为 I=(R+G+B)/3；当 R+G+B>0 时，S=1−3min(R,G,B)/(R+G+B)。灰色 R=G=B 时 S=0，此时色调没有唯一意义；黑色也需单独约定。",en:"In a common HSI definition, intensity is the average of R, G and B; hue is undefined for achromatic colors.",aliases:["平均","average","S=0","未定义","undefined"]},
      {label:"用途与联系",text:"RGB 适合摄像、显示与硬件表达；HSI 便于分开处理强度和颜色，例如主要修改 I 而尽量保留 H、S。HSI 不等于 HSV 或 HSL，转换与输出还需注意 RGB 可表示范围。",en:"RGB is convenient for acquisition and display, while HSI helps separate intensity processing from color information.",aliases:["显示","display","分离","separate","强度"]}
    ],
    trap:"HSI 中 I 通常是 RGB 平均值；HSV 的 V 是最大通道，两者不要混用。灰色的 H 不是一个物理上唯一确定的颜色角度。",
    variants:["What do the three coordinates of RGB and HSI mean?", "Why is HSI useful when adjusting image intensity while preserving color?"],
    quiz:{prompt:"在常用 HSI 定义中，RGB=(0.3,0.6,0.9) 的 I 为多少？",options:["0.3","0.6","0.9","1.8"],answer:1,explain:"I=(R+G+B)/3=1.8/3=0.6；最大通道0.9是 HSV 中 V 的定义。"},
    cloze:{text:"The letter S in HSI stands for ___.",answers:["saturation","饱和度"],explain:"完整记住 Hue、Saturation、Intensity 及各自中文含义。"}
  },
  {
    id:23,title:"伪彩色图像",topic:"彩色图像",
    en:"What is a pseudo-color image? Give methods of generating a pseudo-color image from a gray image.",
    zh:"什么是伪彩色图像？怎样从灰度图生成伪彩色图？",
    cues:[{en:"pseudo-color",zh:"把灰度或测量值人为映射到颜色"},{en:"intensity slicing",zh:"灰度分层，每段一种颜色"},{en:"gray-level to color transformation",zh:"连续映射为 R、G、B"}],
    intuition:"温度图把较低温度画成蓝、较高温度画成红。颜色帮助人分辨数据差异，但不代表被拍物体本来的真实颜色。",
    points:[
      {label:"定义与目的",text:"伪彩色是按人为规定的映射，把灰度值或其他单通道测量值赋成颜色，以突出层次、便于观察和解释。它不恢复物体真实光谱颜色。",en:"Pseudo-color assigns artificial colors to gray levels to improve visualization and interpretation.",aliases:["人为","映射","artificial","gray","可视化"]},
      {label:"灰度分层",text:"把灰度轴分成若干区间，每个区间指定一种颜色；像素根据所在区间着色，也称 intensity slicing 或 density slicing。",en:"Intensity slicing divides the gray-level range into intervals and assigns one color to each interval.",aliases:["区间","分层","slicing","intervals"]},
      {label:"连续灰度到彩色变换",text:"设计三个映射 R=Tᵣ(r)、G=Tɢ(r)、B=Tᵦ(r)，或用查找表 LUT 把每个灰度映射为 RGB 三元组。映射可连续变化以减少分层突变。",en:"Gray-level-to-color transformation maps each intensity to RGB components using three functions or a lookup table.",aliases:["RGB","LUT","三个","lookup","transformation"]},
      {label:"解释边界",text:"应保留色标说明数值含义。同一灰度输入在确定映射下得到同一颜色；颜色只是重新编码现有信息，不能凭空增加原始测量信息。",en:"A color legend explains the mapping; pseudo-color changes the display, not the original measurement information.",aliases:["色标","legend","信息","mapping"]}
    ],
    example:"<p><strong>新编例子：</strong>对8位灰度，0–84映射蓝、85–169映射绿、170–255映射红。灰度120会显示绿色。这是分层映射，不是找回物体本来的绿色。</p>",
    trap:"伪彩色不等于给黑白照片推测真实颜色。写方法时要给出‘分层着色’和‘灰度到 RGB 变换’两个可操作方案。",
    variants:["Describe intensity slicing and RGB mapping for pseudo-color display.","How can colors be assigned to a monochrome image to make intensity differences easier to see?"],
    quiz:{prompt:"把灰度0–84设为蓝色、85–169设为绿色、170–255设为红色，这属于什么方法？",options:["图像恢复","灰度分层伪彩色","Huffman编码","最近邻插值"],answer:1,explain:"将灰度范围划成若干区间再赋色，正是 intensity slicing。"},
    cloze:{text:"Assigning one color to each gray-level interval is called intensity ___.",answers:["slicing","分层"],explain:"intensity slicing 是本题识别度很高的核心短语。"}
  },
  {
    id:25,title:"压缩的保真度评价",topic:"图像压缩",
    en:"What are the commonly used fidelity criteria for evaluating image compression? Explain them separately.",
    zh:"评价图像压缩常用哪些保真度准则？分别说明。",
    cues:[{en:"fidelity criteria",zh:"重建图与原图有多接近"},{en:"objective / subjective",zh:"数值误差 / 人的观察评分"},{en:"MSE / RMSE / SNR / PSNR",zh:"误差越小、信噪比越大通常越好"}],
    intuition:"压缩率回答文件省了多少空间；保真度回答重建图失去了多少信息、看起来受了多大影响。这是两个不同问题。",
    points:[
      {label:"客观误差准则",text:"设原图 f、重建图 g、像素数 MN。MSE=(1/MN)Σ[f(x,y)−g(x,y)]²；RMSE=√MSE。二者越小表示逐像素误差越小，RMSE 与灰度值同单位。",en:"MSE is the mean squared reconstruction error, and RMSE is its square root; lower values indicate smaller pixel errors.",aliases:["MSE","RMSE","均方","平方","squared"]},
      {label:"信噪比 SNR",text:"将重建误差 e=f−g 看作噪声，可定义能量比 SNR=Σf²/Σe²；其分贝值为10log₁₀(SNR)。RMS信噪比是该能量比的平方根。题目计算时要注明所用定义。",en:"SNR compares signal energy with reconstruction-error energy; its decibel value is ten times the base-ten logarithm of the energy ratio.",aliases:["能量","energy","SNR","信噪比"]},
      {label:"峰值信噪比 PSNR",text:"PSNR=10log₁₀(MAX²/MSE)，单位 dB；8位无符号图像 MAX=255。相同动态范围下 PSNR 越大通常失真越小；MSE=0 时为正无穷。",en:"PSNR equals 10 log10 of MAX squared divided by MSE; a larger PSNR generally indicates lower distortion at the same intensity range.",aliases:["PSNR","MAX","255","峰值","10log"]},
      {label:"主观准则与限制",text:"让观察者在规定条件下给重建图的质量或失真打分。人的观感受结构、纹理、观看距离等影响，MSE相同的图像也可能看起来不同，因此客观数值不能完全代替主观评价。",en:"Subjective criteria use human quality ratings; objective error measures do not fully predict perceived quality.",aliases:["主观","观察者","human","subjective","感知"]}
    ],
    example:"<p><strong>新编例题：</strong>8位图像的 MSE=100，则 RMSE=10，PSNR=10log₁₀(255²/100)≈<strong>28.13 dB</strong>。若另一压缩结果 MSE=25，则 PSNR≈34.15 dB。</p>",
    trap:"entropy、average code length 和 compression ratio 衡量编码与数据量，不是重建保真度。不要把 SNR 的能量比与分贝数、或它的平方根混用。",
    variants:["Distinguish objective and subjective measures of image-compression fidelity.","Define reconstruction error, SNR and PSNR for a compressed image."],
    quiz:{prompt:"对于相同位深和动态范围的两张重建图，MSE从100降为25，PSNR会怎样？",options:["增加约6.02 dB","减少约6.02 dB","保持不变","变为原来的四分之一"],answer:0,explain:"PSNR增加10log₁₀(100/25)=10log₁₀4≈6.02 dB。"},
    cloze:{text:"The square root of MSE is called ___.",answers:["RMSE","root mean square error","均方根误差"],explain:"MSE是均方误差，RMSE是均方根误差。"},
    sources:["https://www.mathworks.com/help/images/ref/psnr.html","https://www.mathworks.com/help/signal/ref/snr.html","https://www.mathworks.com/help/wavelet/ref/measerr.html"]
  },
  {
    id:26,title:"Huffman 编码与四个指标",topic:"图像压缩",
    en:"What is the basic idea of Huffman coding? Provide the computing methods and meanings of entropy, average code length, coding efficiency and redundancy.",
    zh:"说明 Huffman 编码思想，以及熵、平均码长、编码效率、冗余度的含义和计算方法。",
    cues:[{en:"Huffman coding",zh:"每次合并两个最小概率节点"},{en:"entropy / average code length",zh:"理论平均信息量 / 实际平均比特数"},{en:"efficiency / redundancy",zh:"H/L̄ / 1−H/L̄"}],
    intuition:"常见符号配短码，少见符号配长码。在能逐符号无歧义解码的前缀码中，Huffman用一棵树尽量缩短平均码长。",
    points:[
      {label:"构造步骤",text:"统计符号概率，每次取最小的两个节点合并，父节点概率为二者之和；重复直到只剩根。给每处分支标0、1，从根到叶的路径是码字。得到前缀码；0/1互换和概率并列可产生不同但同样有效的码表。",en:"Repeatedly merge the two least probable nodes, label branches zero and one, and read each codeword from the root to its leaf.",aliases:["最小","合并","two","merge","least"]},
      {label:"信息熵",text:"H=−Σpᵢlog₂pᵢ，单位 bit/symbol；pᵢ=0 的项按0计。它表示信源每符号的平均信息量，是相应二元无失真编码平均码长的理论下界。",en:"Entropy H equals minus the sum of p log2 p and measures average information in bits per symbol.",aliases:["熵","entropy","log","信息量","下界"]},
      {label:"平均码长",text:"L̄=Σpᵢlᵢ，其中 lᵢ 是第i个码字的比特数。二元 Huffman 对给定概率的逐符号前缀编码具有最小平均码长，通常满足 H≤L̄<H+1（非退化信源）。",en:"The average code length is the probability-weighted sum of codeword lengths, Lbar = sum of p times l.",aliases:["平均码长","weighted","概率","码长","p"]},
      {label:"效率与冗余",text:"编码效率 η=H/L̄，通常写成百分数；相对编码冗余 r=1−η。若问每符号多用多少比特，则为 L̄−H，单位bit/symbol。不要混淆这两种冗余量。",en:"Coding efficiency is H divided by Lbar; relative redundancy is one minus the efficiency.",aliases:["H/L","效率","1−","redundancy","efficiency"]}
    ],
    example:"<p><strong>新编完整例题：</strong>p(A,B,C,D)=(0.4,0.3,0.2,0.1)。合并0.1+0.2=0.3，再合并0.3+0.3=0.6，最后0.4+0.6=1。一种码表：A=0，B=10，C=110，D=111。</p><p>L̄=0.4×1+0.3×2+0.2×3+0.1×3=<strong>1.9 bit/symbol</strong>；H≈1.84644；η≈1.84644/1.9=<strong>97.18%</strong>；r≈<strong>2.82%</strong>；L̄−H≈0.05356 bit/symbol。</p>",
    trap:"码字本身不唯一，比较的是前缀可解码性和平均码长；熵不是把全部码长直接相加。编码效率 H/L̄ 不等于压缩率，也不要把百分数再当小数相减。",
    variants:["Construct a variable-length prefix code by repeatedly merging the smallest probabilities.","How are source entropy, expected code length and coding redundancy related in Huffman coding?"],
    quiz:{prompt:"某信源 H=1.8 bit/symbol，平均码长L̄=2，编码效率和相对冗余分别是多少？",options:["90%，10%","10%，90%","111.1%，−11.1%","1.8%，2%"],answer:0,explain:"η=H/L̄=0.9=90%；r=1−η=10%。"},
    cloze:{text:"At each step, Huffman coding merges the two nodes with the ___ probabilities.",answers:["smallest","lowest","least","最小"],explain:"记住 two smallest probabilities，不是先合并最大的两个。"},
    sources:["https://www.cs.cmu.edu/~15750/notes/jason-lec19.pdf","https://ocw.mit.edu/courses/18-200-principles-of-discrete-applied-mathematics-spring-2024/mit18_200_s24_lec19.pdf"]
  },
  {
    id:27,title:"预测编码为什么有效",topic:"图像压缩",
    en:"What is the basic idea of predictive coding? Why is quantizing and encoding prediction errors more efficient than directly quantizing and encoding raw data?",
    zh:"预测编码的基本思想是什么？为什么编码预测误差通常比直接编码原始数据有效？",
    cues:[{en:"predictive coding",zh:"用已知邻点预测当前像素"},{en:"prediction error / residual",zh:"原值减预测值"},{en:"spatial redundancy",zh:"相邻像素相关，存在空间冗余"}],
    intuition:"一排灰度100、101、100、102，大体都在100附近。已知道前一个数后，只需记录它们相差多少，残差大多靠近0，适合用短码表示。",
    points:[
      {label:"利用相关性预测",text:"图像相邻像素通常相关。按确定扫描顺序，用双方都能获得的已编码/已重建邻点预测当前像素，预测器记为 f̂(x,y)。",en:"Predict each pixel from previously encoded or reconstructed neighbors to exploit spatial correlation.",aliases:["邻","预测","correlation","neighbors","空间"]},
      {label:"编码残差与重建",text:"计算残差 e=f−f̂，对残差进行熵编码；解码端用相同邻点和预测规则得到同一 f̂，再将解码残差相加重建。首像素、边界和预测器规则也须能确定。",en:"Encode the prediction error e = f minus the predicted value; reconstruct by adding the decoded error to the same prediction.",aliases:["残差","error","相加","重建","subtract"]},
      {label:"节省比特的原因",text:"预测准确时残差更集中在0附近、方差通常较小、分布更不均匀，常使残差的边缘熵更低，便于熵编码。变小的是统计冗余；可逆预测变换没有删除原图信息。",en:"A good predictor produces errors concentrated near zero, often reducing their variance and marginal entropy and improving entropy coding.",aliases:["零","集中","熵","entropy","redundancy","方差"]},
      {label:"有损与无损",text:"不量化且精确编码残差可以无损；对残差量化则通常有损。量化预测编码须使用解码端同样的重建样本反馈预测，避免编码端与解码端预测失配；效果取决于预测器和图像。",en:"Exact residual coding can be lossless; quantizing the residual generally introduces loss, and both sides must use matching predictions.",aliases:["无损","量化","lossless","quantiz","一致"]}
    ],
    example:"<p><strong>新编例子：</strong>像素100、101、100、102，首值单独记录，其后用前一像素预测，残差为1、−1、2。接收端从100依次相加可精确恢复。残差的可能数值范围仍可含负数，不能仅凭‘数值小’断言一定省比特。</p>",
    trap:"‘预测编码必然有损’不成立；损失常来自量化。‘残差一定比原图范围小’也不成立，差值可能为负且范围更宽，关键在实际概率分布和可压缩性。",
    variants:["Explain how coding residuals removes interpixel redundancy.","Describe the encoder and decoder of predictive image coding and distinguish lossless from lossy prediction."],
    quiz:{prompt:"真实像素为150，双方预测值为147。若精确传输残差3，解码值为多少？",options:["3","147","150","153"],answer:2,explain:"重建值=预测值+残差=147+3=150，精确残差可实现无损重建。"},
    cloze:{text:"The difference between an actual pixel and its predicted value is the prediction ___.",answers:["error","residual","误差","残差"],explain:"prediction error 和 residual 是本题的核心同义表达。"},
    sources:["https://cmp.felk.cvut.cz/~drbohlav/TeachPres/imagecompression-v2.pdf"]
  },
  {
    id:28,title:"图像分割的五个条件",topic:"分割与描述",
    en:"Divide an image into multiple subregions R1, R2, ..., Rn. What are the characteristics of these subregions?",
    zh:"将图像分成多个子区域 R₁、R₂、…、Rₙ，这些区域应满足哪些条件？",
    cues:[{en:"subregions / segmentation",zh:"分割是对整幅图像作区域划分"},{en:"connected / disjoint",zh:"区域内部连通，区域之间不重叠"},{en:"homogeneous predicate",zh:"区域内部满足同质性准则"}],
    intuition:"把一张地图分成完整的行政区：不能漏地、不能一块地归两个区、每个区内部要连通，还要有一个划分标准。相邻两区若合在一起仍满足同一标准，就还没分到合适程度。",
    points:[
      {label:"完整覆盖",text:"所有区域的并集等于整个图像区域 R：⋃ᵢRᵢ=R。每个像素都被划分，不能遗漏。",en:"The union of all subregions equals the entire image region.",aliases:["覆盖","并集","union","entire","遗漏"]},
      {label:"互不重叠",text:"当 i≠j 时，Rᵢ∩Rⱼ=∅。一个像素只能属于一个子区域。",en:"Different subregions are disjoint: their intersection is empty.",aliases:["不重叠","交集","disjoint","empty","互斥"]},
      {label:"区域连通",text:"每个 Rᵢ 都是连通区域：区域内任意两像素间有完全位于该区域内的路径。需要事先规定4连通、8连通等邻接规则。",en:"Each subregion is connected under a specified connectivity rule.",aliases:["连通","connected","路径","connectivity"]},
      {label:"区域内同质",text:"对预先规定的同质性谓词 P，每个区域满足 P(Rᵢ)=TRUE，例如灰度、颜色或纹理符合给定标准。‘同质’不必是每个像素数值完全相等。",en:"Every subregion satisfies the chosen homogeneity predicate.",aliases:["同质","谓词","TRUE","homogeneity","predicate"]},
      {label:"相邻区域不能再合并",text:"对不同且相邻的 Rᵢ、Rⱼ，P(Rᵢ∪Rⱼ)=FALSE。即它们合并后不再满足同质性要求，防止无意义的过度细分。",en:"The union of any two adjacent subregions fails the homogeneity predicate.",aliases:["相邻","合并","FALSE","adjacent","union"]}
    ],
    trap:"‘相邻区域合并不再同质’针对相邻区域，别漏掉 adjacent。‘连通’是空间路径条件，‘同质’是灰度或特征条件，两者不能互相代替。",
    variants:["State the five conditions for a complete image segmentation.","What coverage, connectivity and homogeneity requirements must a partition of an image satisfy?"],
    quiz:{prompt:"一个分割结果中，同一像素同时属于R₁与R₂，它首先违反哪个条件？",options:["完整覆盖","互不重叠","区域内部连通","灰度必须相等"],answer:1,explain:"R₁∩R₂不为空，违反分割区域的互斥性。"},
    cloze:{text:"For two adjacent final regions, the homogeneity predicate of their union should be ___.",answers:["false","FALSE","假","不成立"],explain:"每个区域自身满足 P，但相邻最终区域合并后不满足 P。"},
    sources:["https://www.cs.auckland.ac.nz/courses/compsci773s1c/lectures/ImageProcessing-html/topic3.htm"]
  },
  {
    id:29,title:"一阶与二阶微分检测边缘",topic:"分割与描述",
    en:"What is the theoretical basis for edge detection using first-order and second-order differential operators? Provide operator templates for each.",
    zh:"用一阶、二阶微分检测边缘的理论依据是什么？分别给出算子模板。",
    cues:[{en:"first-order / gradient",zh:"一阶：检测灰度变化强度"},{en:"second-order / Laplacian",zh:"二阶：检测变化率的变化"},{en:"operator templates",zh:"答案必须写出模板"}],
    intuition:"沿图像走过一条边，灰度会快速变化。一阶导数告诉你‘变得有多快’，二阶导数告诉你‘这个变化速度在怎样改变’。",
    points:[
      {label:"边缘的理论依据",text:"边缘附近灰度通常快速变化，微分能突出这种变化；平坦区域导数接近0。一阶常通过梯度幅值的局部极大或阈值检测边缘；对平滑阶跃边，二阶响应可在边缘附近产生过零。",en:"Edges correspond to rapid intensity changes; first derivatives have strong responses, while second derivatives can locate zero crossings near smoothed step edges.",aliases:["快速","变化","gradient","zero","过零","导数"]},
      {label:"一阶梯度",text:"∇f=(Gₓ,Gᵧ)，幅值 |∇f|=√(Gₓ²+Gᵧ²)，常用 |Gₓ|+|Gᵧ|近似。梯度方向沿灰度增长最快方向，与局部边缘切线大致垂直。",en:"The gradient magnitude measures edge strength, and its direction is approximately normal to the local edge.",aliases:["幅值","magnitude","梯度","Gx","方向"]},
      {label:"一阶模板示例",text:"Sobel 水平导数模板 Gₓ=[−1 0 1; −2 0 2; −1 0 1]，垂直导数模板 Gᵧ=[−1 −2 −1; 0 0 0; 1 2 1]。先各自计算再组合幅值；Gₓ检测沿x的变化，常突出垂直边。",en:"Sobel uses two three-by-three masks to estimate horizontal and vertical intensity derivatives.",aliases:["Sobel","模板","水平","垂直","mask"]},
      {label:"二阶模板与限制",text:"拉普拉斯 ∇²f=∂²f/∂x²+∂²f/∂y²，模板可用 [0 1 0; 1 −4 1; 0 1 0]。它不直接给边缘方向，且对噪声敏感，通常先平滑；过零还需足够的响应变化幅度，不能把所有0值都当边缘。",en:"The Laplacian sums second derivatives; smoothing and a response threshold help prevent noise and insignificant zero crossings from being detected as edges.",aliases:["Laplacian","拉普拉斯","噪声","noise","二阶","平滑"]}
    ],
    example:"<p><strong>可直接写到答卷的模板：</strong></p><pre>Sobel Gx       Sobel Gy       Laplacian\n-1  0  1      -1 -2 -1       0  1  0\n-2  0  2       0  0  0       1 -4  1\n-1  0  1       1  2  1       0  1  0</pre><p>坐标轴方向或卷积/相关约定不同，模板整体变号可能仍正确；检测幅值和过零时必须保持同一约定。</p>",
    trap:"一阶找强响应，二阶可找过零；‘拉普拉斯等于0就一定是边缘’是错的，平坦区域也可能处处为0。别只写名字不写模板。",
    variants:["Explain gradient-based and Laplacian-based edge detection and give suitable masks.","Why do derivatives reveal image edges, and how do first and second derivatives differ?"],
    quiz:{prompt:"对平滑阶跃边缘，下面哪个描述最合适？",options:["一阶响应一定为0","二阶的所有0值都是边缘","一阶幅值较强，二阶可在边缘附近过零","微分会自动消除全部噪声"],answer:2,explain:"微分突出变化，一阶产生强响应；二阶可产生过零，但还需平滑与幅度条件来排除无意义响应。"},
    cloze:{text:"The Laplacian is a ___-order differential operator.",answers:["second","2","二","二阶"],explain:"gradient 是一阶，Laplacian 是二阶。"},
    sources:["https://docs.opencv.org/3.4.7/d2/d2c/tutorial_sobel_derivatives.html","https://docs.opencv.org/3.4.9/d5/db5/tutorial_laplace_operator.html"]
  },
  {
    id:30,title:"区域生长的思路与实际问题",topic:"分割与描述",
    en:"What is the basic idea of region growing? What problems need to be solved in practical applications?",
    zh:"区域生长的基本思想是什么？实际应用中需要解决哪些问题？",
    cues:[{en:"region growing",zh:"从种子出发，把相似邻点逐步并入"},{en:"seed / similarity / connectivity",zh:"种子、相似判据、邻接规则"},{en:"stopping criterion",zh:"何时停止，怎样防止越界泄漏"}],
    intuition:"先在目标内部点一个种子，再像墨水扩散一样检查邻点；只有满足相似条件的像素才吸收进来。与墨水不同，它应在目标边界停下。",
    points:[
      {label:"基本思想",text:"区域生长是基于相似性的分割方法：从一个或多个种子开始，反复把满足条件的相邻像素并入区域，使区域逐步扩大。",en:"Region growing starts from seeds and repeatedly adds neighboring pixels that satisfy a similarity criterion.",aliases:["种子","相邻","相似","seeds","neighboring"]},
      {label:"种子与相似性",text:"选择有代表性的种子和区域数；定义灰度、颜色、纹理等相似判据。可比较像素与种子或当前区域均值的差，并明确阈值；后者需随生长更新区域统计量。",en:"Choose representative seeds and define a similarity test based on intensity, color or texture, with clearly specified thresholds.",aliases:["阈值","种子","similarity","threshold","均值"]},
      {label:"邻接与生长规则",text:"指定4邻域或8邻域；用待检查队列记录边界邻点，将合格且未标记的像素加入区域。多种子竞争时规定归属和处理顺序，避免重复标记。",en:"Specify connectivity and update rules, inspect unassigned neighbors, and resolve competition between growing regions.",aliases:["连通","邻域","connectivity","队列","归属"]},
      {label:"停止与实用问题",text:"当没有邻点满足条件时停止；检查噪声、弱边界造成的泄漏、灰度渐变和阈值敏感性。需要时先去噪、结合边缘限制，并处理未分配像素与可合并区域。",en:"Stop when no eligible neighbor remains; handle noise, weak boundaries, leakage, unassigned pixels and possible region merging.",aliases:["停止","泄漏","noise","stop","leakage","边界"]}
    ],
    example:"<p><strong>新编例子：</strong>种子灰度100，规定与种子差不超过10，且采用4邻接。相邻像素106可加入，125不可加入；远处一个灰度103的孤立像素也不能直接加入，因为它尚未与该区域相邻。</p>",
    trap:"只看灰度相似而不检查相邻关系，就可能把远处无关像素合进来。还要说清与谁比较：种子、当前区域均值和上一像素不是同一个规则。",
    variants:["Describe seed-based region growing and discuss seed selection, similarity tests and stopping rules.","How are neighboring pixels merged into a region, and why can region growing leak across weak boundaries?"],
    quiz:{prompt:"采用4邻接区域生长时，远处一个与种子灰度相同的孤立像素，是否立刻加入区域？",options:["一定加入，因为灰度相同","不应直接加入，还须满足与区域相邻等条件","只有改成8位图像才加入","一定属于边缘"],answer:1,explain:"区域生长同时要求相似性与空间连通性，灰度相同不能代替相邻条件。"},
    cloze:{text:"Region growing begins with one or more ___ pixels.",answers:["seed","seeds","种子"],explain:"本题可用 seeds → similarity → neighbors → stopping 来回忆答案结构。"},
    sources:["https://www.cs.auckland.ac.nz/courses/compsci773s1c/lectures/ImageProcessing-html/topic3.htm"]
  },
  {
    id:31,title:"自动全局阈值的迭代步骤",topic:"分割与描述",
    en:"Provide implementation steps for automatic global threshold processing applicable to bimodal-histogram image segmentation.",
    zh:"给出适用于双峰直方图分割的自动全局阈值迭代步骤。",
    cues:[{en:"automatic global threshold",zh:"用一个自动估计的阈值分割整张图"},{en:"bimodal histogram",zh:"目标与背景形成两类灰度分布"},{en:"two class means",zh:"两类均值的中点更新阈值"}],
    intuition:"先猜一道分界线，把像素分成亮、暗两堆；看两堆各自的平均值，把分界线移到两个平均值中间；再分堆，直到分界线基本不动。",
    points:[
      {label:"初始化",text:"选初始阈值 T₀，例如全图平均灰度；给定终止容差 ε 和最大迭代次数。非常量图像要使初值位于最小、最大灰度之间。",en:"Choose an initial threshold, a convergence tolerance and a maximum number of iterations.",aliases:["初始","initial","容差","平均","阈值"]},
      {label:"分组",text:"按当前 T 分成 G₁={f>T} 和 G₂={f≤T}。相等情况归哪一组可以另作约定，但整个算法需保持一致。",en:"Partition the pixels into two groups using the current threshold.",aliases:["分组","两组","partition","groups","≤"]},
      {label:"求均值并更新",text:"计算两组像素的平均灰度 μ₁、μ₂，更新 Tnew=(μ₁+μ₂)/2。若由直方图计算，须按各灰度的像素数加权，不能对出现过的灰度简单平均。",en:"Compute each group mean and update the threshold to the midpoint, Tnew = (mu1 + mu2) / 2.",aliases:["均值","中点","mean","midpoint","更新"]},
      {label:"重复、停止与输出",text:"重复分组和更新，直到 |Tnew−T|<ε 或达到迭代上限，再用最终 T 二值化。常量图像或空组需单独处理。方法适合两类较可分的灰度，照明明显不均时单一全局阈值可能不够。",en:"Repeat until the threshold changes by less than the tolerance, then binarize the image using the final threshold.",aliases:["重复","停止","tolerance","repeat","二值化"]}
    ],
    example:"<p><strong>新编例题：</strong>灰度为10、12、14、100、104，取T₀=50。暗组均值12，亮组均值102，T₁=(12+102)/2=57。用57重分，分组不变，T₂=57，迭代停止。按f>T置1，结果为0、0、0、1、1。</p>",
    trap:"本题这里采用‘两类均值中点’的基本迭代法，不要把它的更新公式和 Otsu 最大类间方差混写。空组时不能除以0。",
    variants:["Describe iterative threshold selection using the means of two pixel groups.","How can a global threshold be estimated automatically for a two-mode intensity histogram?"],
    quiz:{prompt:"某次分组的均值为40和160，下一次阈值是多少？",options:["40","80","100","160"],answer:2,explain:"新阈值取两类均值中点：(40+160)/2=100。"},
    cloze:{text:"The iterative global threshold is updated to the ___ of the two group means.",answers:["midpoint","average","中点","平均值"],explain:"Tnew=(μ₁+μ₂)/2，然后重新分组、再求均值。"}
  },
  {
    id:32,title:"区域表示与区域描述",topic:"分割与描述",
    en:"Explain the connection and difference between region representation and description.",
    zh:"解释区域表示与区域描述的联系和区别。",
    cues:[{en:"representation",zh:"用什么结构保存区域或边界"},{en:"description / descriptors",zh:"从区域提取什么特征"},{en:"boundary / region",zh:"边界表示与完整区域表示"}],
    intuition:"轮廓点列表像把一个人的外形画下来；身高、周长等数值像给这个外形作特征摘要。前者是表示，后者是描述。",
    points:[
      {label:"区域表示",text:"区域表示决定以什么数据结构保存分割对象。可用边界表示，如有序边界点、链码；也可用区域表示，如区域内像素集合、二值掩膜或游程。",en:"Representation specifies how an object is stored, using its boundary or its complete region.",aliases:["边界","像素","存储","boundary","stored","mask"]},
      {label:"区域描述",text:"描述是根据表示提取可用于比较和识别的特征，例如面积、周长、质心、紧致度、矩、纹理。它通常形成比原始区域数据更简洁的特征向量。",en:"Description extracts features such as area, perimeter, centroid, moments and texture for comparison or recognition.",aliases:["特征","面积","features","area","识别"]},
      {label:"二者联系",text:"表示为描述提供数据，描述把区域的性质转成适合分析的量。选择边界表示还是完整区域表示，取决于任务主要关注形状轮廓还是内部灰度、纹理等信息。",en:"Representation supplies the data for description, and the task determines which representation and descriptors are appropriate.",aliases:["数据","提供","supplies","任务","描述"]},
      {label:"不变性需求",text:"识别任务常希望描述对平移、旋转或尺度变化不敏感，需要适当归一化；不是所有描述天然具备这些不变性。面积会随尺度改变，质心会随位置改变。",en:"Descriptors may require normalization for translation, rotation or scale invariance.",aliases:["不变","归一化","invariance","normalization","尺度"]}
    ],
    example:"<p><strong>新编例子：</strong>一块3×2像素的二值矩形，用6个前景像素或边界链码保存，是表示；由它计算面积A=6像素，是描述。周长取决于使用像素边缘还是像素中心轮廓，计算前须给出约定。</p>",
    trap:"链码是边界表示；从链码得到的形状特征可用于描述。不要把 representation 和 recognition（识别）当同一个概念。",
    variants:["Distinguish storing a region from extracting descriptors of that region.","How do boundary representations and region descriptors support object recognition?"],
    quiz:{prompt:"用边界点列表保存对象，再计算它的周长，前后分别是什么？",options:["描述、表示","表示、描述","恢复、增强","压缩、插值"],answer:1,explain:"边界点列表保存对象，是表示；计算周长得到特征，是描述。"},
    cloze:{text:"Area, perimeter and texture are examples of region ___.",answers:["descriptors","features","描述子","特征"],explain:"representation 提供对象数据，description 提取 descriptors。"}
  },
  {
    id:33,title:"四方向链码与形状数",topic:"分割与描述",
    en:"Calculate the 4-direction chain code representation of the following image. Provide the chain code, rotation-normalized chain code (cyclic differential chain code), and shape number.",
    zh:"求给定图形的四方向链码、循环差分链码和形状数。",
    note:"已从作业的原生矢量形状恢复第33题图形。原图未标起点及方向编码表，下方明确约定从左上角开始，右0、上1、左2、下3，沿原图箭头绕行；若课堂约定不同，绝对码串可能不同。",
    cues:[{en:"4-direction chain code",zh:"每一步只能沿上下左右"},{en:"cyclic differential chain code",zh:"相邻方向差取模4，包含末步到首步"},{en:"shape number",zh:"差分链码的最小循环移位"}],

  english:'<p><strong>1. Find the image data.</strong> Since 256 = 2<sup>8</sup>, each pixel needs 8 bits, or one byte.</p><pre>Pixels: N = 1024 × 1024 = 1,048,576\nImage data: B = N × 8 = 8,388,608 bits\n                         = 1,048,576 bytes</pre><p><strong>2. Add the transmission overhead.</strong> Each byte needs one start bit and one stop bit. It therefore takes 8 + 1 + 1 = 10 bits to send one byte.</p><pre>Overhead = N × 2 = 2,097,152 bits\nTotal bits = N × 10 = 10,485,760 bits</pre><p>The overhead is 2/8 = 25% of the image data, or 2/10 = 20% of the total bits.</p><p><strong>3. Convert the rates.</strong> One symbol carries one bit, and K = 1000. Thus 56 Kbaud = 56,000 bit/s and 3000 Kbaud = 3,000,000 bit/s.</p><p><strong>4. Calculate the times.</strong> Use time = total bits ÷ bit rate:</p><pre>At 56 Kbaud:\nt₁ = 10,485,760 / 56,000 = 187.245714… s ≈ 187.25 s\n\nAt 3000 Kbaud:\nt₂ = 10,485,760 / 3,000,000 ≈ 3.50 s</pre>',
  chinese:'<p><strong>1．求图像数据量。</strong>256 = 2<sup>8</sup>，所以每像素需要 8 bit，正好一个字节。</p><pre>像素数：N = 1024 × 1024 = 1,048,576\n图像数据量：B = N × 8 = 8,388,608 bit\n                       = 1,048,576 byte</pre><p><strong>2．加上传输开销。</strong>每个字节都加一个起始位和一个停止位，因此发送一个字节要用 8 + 1 + 1 = 10 bit。</p><pre>传输开销 = N × 2 = 2,097,152 bit\n总传输位数 = N × 10 = 10,485,760 bit</pre><p>开销相当于图像数据量的 2/8 = 25%，占总传输位数的 2/10 = 20%。</p><p><strong>3．换算传输速率。</strong>题目规定每符号携带 1 bit，K = 1000。因此，56 Kbaud = 56,000 bit/s，3000 Kbaud = 3,000,000 bit/s。</p><p><strong>4．计算传输时间。</strong>时间 = 总传输位数 ÷ 比特率：</p><pre>56 Kbaud 时：\nt₁ = 10,485,760 / 56,000 = 187.245714… s ≈ 187.25 s\n\n3000 Kbaud 时：\nt₂ = 10,485,760 / 3,000,000 ≈ 3.50 s</pre>',
  scoring:['256 = 2⁸，每像素 8 bit；共 1,048,576 像素','有效数据量 8,388,608 bit，每字节另加起始、停止两位','开销 2,097,152 bit，总传输量 10,485,760 bit','由 one bit per symbol、K = 1000 得 56,000 与 3,000,000 bit/s','用 t = 总传输位数/比特率，求出约 187.25 s 与 3.50 s']
 },

  status:'原题矩阵已补齐 · 教材 8.9(a)(b)(c) 完整计算参考范本',
  english:'<p><strong>(a) Find the entropy.</strong> There are 32 pixels. The gray levels 21, 95, 169 and 243 occur 12, 4, 4 and 12 times. Their probabilities are 3/8, 1/8, 1/8 and 3/8.</p><pre>H = −Σ pᵢ log₂pᵢ\n  = −2(3/8)log₂(3/8) − 2(1/8)log₂(1/8)\n  ≈ 1.811278 bits/pixel</pre><p><strong>(b) Build a Huffman code.</strong> Merge the two smallest counts each time:</p><pre>4 + 4 = 8\n8 + 12 = 20\n12 + 20 = 32</pre><p>One valid prefix code is:</p><table><thead><tr><th>Gray level</th><th>Count</th><th>Probability</th><th>Code</th><th>Length</th></tr></thead><tbody><tr><td>21</td><td>12</td><td>3/8</td><td>10</td><td>2</td></tr><tr><td>95</td><td>4</td><td>1/8</td><td>110</td><td>3</td></tr><tr><td>169</td><td>4</td><td>1/8</td><td>111</td><td>3</td></tr><tr><td>243</td><td>12</td><td>3/8</td><td>0</td><td>1</td></tr></tbody></table><p>Each row becomes <code>101010110111000</code>, a 15-bit sequence. Repeat it four times to encode the whole image: 4 × 15 = <strong>60 bits</strong>. Other Huffman codes are also valid if they are prefix-free and have the same optimal average length.</p><p><strong>(c) Calculate compression and efficiency.</strong> First find the average code length:</p><pre>L̄ = (3/8)×2 + (1/8)×3 + (1/8)×3 + (3/8)×1\n  = 1.875 bits/pixel</pre><p>The original size is 32 × 8 = 256 bits. The coded size is 32 × 1.875 = 60 bits.</p><pre>Compression ratio:\nCR = 256/60 ≈ 4.27:1\n\nCoding efficiency:\nη = H/L̄ = 1.811278124…/1.875 ≈ 96.60%</pre><p>Relative coding redundancy = 1−η ≈ <strong>3.40%</strong>.<br>Storage saved = 1−60/256 = <strong>76.5625%</strong>.</p><p>Codebook costs, file headers and byte padding are not included.</p>',
  chinese:'<p><strong>(a) 求图像熵。</strong>共有 32 个像素。灰度 21、95、169、243 分别出现 12、4、4、12 次，概率依次为 3/8、1/8、1/8、3/8。</p><pre>H = −Σ pᵢ log₂pᵢ\n  = −2(3/8)log₂(3/8) − 2(1/8)log₂(1/8)\n  ≈ 1.811278 bit/pixel</pre><p><strong>(b) 建立 Huffman 编码。</strong>每次合并频次最小的两个节点：</p><pre>4 + 4 = 8\n8 + 12 = 20\n12 + 20 = 32</pre><p>得到的一种合法前缀码为：</p><table><thead><tr><th>灰度</th><th>频次</th><th>概率</th><th>码字</th><th>码长</th></tr></thead><tbody><tr><td>21</td><td>12</td><td>3/8</td><td>10</td><td>2</td></tr><tr><td>95</td><td>4</td><td>1/8</td><td>110</td><td>3</td></tr><tr><td>169</td><td>4</td><td>1/8</td><td>111</td><td>3</td></tr><tr><td>243</td><td>12</td><td>3/8</td><td>0</td><td>1</td></tr></tbody></table><p>每行编码为 <code>101010110111000</code>，共 15 bit。四行相同，将这段码重复四次，整幅图共需 4 × 15 = <strong>60 bit</strong>。码表可以不同，只要满足前缀条件并达到相同的最优平均码长。</p><p><strong>(c) 求压缩比和编码效率。</strong>先求平均码长：</p><pre>L̄ = (3/8)×2 + (1/8)×3 + (1/8)×3 + (3/8)×1\n  = 1.875 bit/pixel</pre><p>原图大小为 32 × 8 = 256 bit，编码后为 32 × 1.875 = 60 bit。</p><pre>压缩比：\nCR = 256/60 ≈ 4.27:1\n\n编码效率：\nη = H/L̄ = 1.811278124…/1.875 ≈ 96.60%</pre><p>相对编码冗余 = 1−η ≈ <strong>3.40%</strong>。<br>存储节省比例 = 1−60/256 = <strong>76.5625%</strong>。</p><p>以上不计码表、文件头和字节补齐开销。</p>',
  scoring:['32 像素，频次 12、4、4、12 与概率 3/8、1/8、1/8、3/8','熵公式与 H ≈ 1.811278 bit/pixel','按最小频次合并，给出合法前缀码和原图编码；允许等价码表','平均码长 1.875 bit/pixel，编码总长 60 bit，原图 256 bit','压缩比约 4.27:1，编码效率约 96.60%','声明码表、文件头与补齐不计入；区分编码冗余与存储节省比例']
 }

    2: {
      english: `<p><strong>1. Neighborhood.</strong> For p=(x,y), N<sub>4</sub>(p)={(x±1,y),(x,y±1)} contains its horizontal and vertical neighbors. N<sub>D</sub>(p)={(x±1,y±1)} contains its diagonal neighbors. N<sub>8</sub>(p)=N<sub>4</sub>(p)∪N<sub>D</sub>(p). Ignore positions outside the image.</p><p><strong>2. Adjacency.</strong> Let V contain the allowed gray values. Both pixels must have values in V. They are 4-adjacent if q∈N<sub>4</sub>(p), and 8-adjacent if q∈N<sub>8</sub>(p). For m-adjacency, either q∈N<sub>4</sub>(p), or q∈N<sub>D</sub>(p) and their common 4-neighbors contain no pixel with a value in V. This rule avoids ambiguous diagonal connections.</p><p><strong>3. Connectivity.</strong> Two pixels are connected in S if a path of adjacent pixels joins them within S. All pixels connected to one pixel form a connected component.</p><p><strong>Relation.</strong> Neighborhood describes positions. Adjacency defines a single connection using positions and gray values. Connectivity describes a path of such connections.</p>`,
      chinese: `<p><strong>1．邻域。</strong> 对 p=(x,y)，N<sub>4</sub>(p)={(x±1,y),(x,y±1)} 包含水平和竖直邻居，N<sub>D</sub>(p)={(x±1,y±1)} 包含对角邻居。N<sub>8</sub>(p)=N<sub>4</sub>(p)∪N<sub>D</sub>(p)。超出图像的位置不计入。</p><p><strong>2．邻接。</strong> 设 V 为允许的灰度值集合，两个像素的值都必须属于 V。q∈N<sub>4</sub>(p) 时为四邻接，q∈N<sub>8</sub>(p) 时为八邻接。m 邻接要求：q∈N<sub>4</sub>(p)；或者 q∈N<sub>D</sub>(p)，且两者的公共四邻域中没有灰度值属于 V 的像素。这一规则避免对角连接的歧义。</p><p><strong>3．连通。</strong> 若 S 内存在一条由相邻像素组成的路径连接两个像素，则它们在 S 中连通。与一个像素连通的所有像素组成一个连通分量。</p><p><strong>联系。</strong> 邻域描述位置；邻接结合位置和灰度规定单步连接；连通描述由这些连接组成的路径。</p>`,

    3: {
      english: `<p><strong>1. Image processing is the low level.</strong> It improves image quality. Both input and output are usually images. Examples include noise reduction, image enhancement and image restoration.</p><p><strong>2. Image analysis is the middle level.</strong> It extracts objects and features from an image. The input is an image, and the output includes boundaries, areas or other measurements. An example is segmenting a car and measuring its size.</p><p><strong>3. Image understanding is the high level.</strong> It uses features and knowledge to explain a scene and make decisions. An example is deciding whether a traffic situation is dangerous.</p><p><strong>Relation.</strong> Processing supplies clearer images for analysis. Analysis supplies features for understanding. The information moves from pixels to features and then to meaning. High-level knowledge can also guide lower-level tasks.</p>`,
      chinese: `<p><strong>1．图像处理是低层。</strong> 它改善图像质量，输入和输出通常都是图像。例如去噪、图像增强和图像复原。</p><p><strong>2．图像分析是中层。</strong> 它从图像中提取目标和特征，输入是图像，输出包括边界、面积等测量结果。例如分割出汽车并测量其大小。</p><p><strong>3．图像理解是高层。</strong> 它利用特征和知识解释场景并作出决策。例如判断交通情况是否危险。</p><p><strong>联系。</strong> 图像处理为分析提供更清楚的图像，分析为理解提供特征。信息从像素变为特征，再变为语义。高层知识也可以指导低层任务。</p>`,

    4: {
      english: `<p><strong>Definition.</strong> The histogram counts the pixels at each gray level: h(r<sub>k</sub>)=n<sub>k</sub>. Here, n<sub>k</sub> is the number of pixels with gray value r<sub>k</sub>. The horizontal axis shows gray levels; the vertical axis shows pixel counts. For an M×N image,</p><div class="model-formula">p(r<sub>k</sub>)=n<sub>k</sub>/(MN), &nbsp; Σ<sub>k=0</sub><sup>L−1</sup>p(r<sub>k</sub>)=1.</div><p>The normalized histogram estimates gray-level probabilities.</p><p><strong>Uses.</strong> It shows overall brightness, contrast and gray-level range. Many low-gray pixels usually indicate a dark image. A narrow range often means low contrast. It supports histogram equalization, histogram matching and threshold selection.</p><p><strong>Limit.</strong> It does not record pixel positions. Different images can have the same histogram, so the histogram alone cannot locate objects or recover the image.</p>`,
      chinese: `<p><strong>定义。</strong> 直方图统计每个灰度级的像素数：h(r<sub>k</sub>)=n<sub>k</sub>。其中 n<sub>k</sub> 是灰度为 r<sub>k</sub> 的像素数。横轴表示灰度级，纵轴表示像素数。对 M×N 图像，</p><div class="model-formula">p(r<sub>k</sub>)=n<sub>k</sub>/(MN)，Σ<sub>k=0</sub><sup>L−1</sup>p(r<sub>k</sub>)=1。</div><p>归一化直方图估计各灰度级的概率。</p><p><strong>用途。</strong> 它反映整体亮度、对比度和灰度范围。低灰度像素多通常表示图像偏暗；灰度范围窄通常表示对比度低。它可用于直方图均衡化、直方图规定化和阈值选择。</p><p><strong>局限。</strong> 它不记录像素位置。不同图像可以有相同直方图，因此仅凭直方图不能定位目标或恢复原图。</p>`,

    5: {
      english: `<p><strong>1. Sampling</strong> turns continuous spatial coordinates into a pixel grid. It determines where the image is measured.</p><p><strong>2. Quantization</strong> maps continuous intensity values to a finite number of gray levels. With b bits per pixel, L=2<sup>b</sup> levels are available.</p><p><strong>3. Spatial resolution</strong> is the ability to show fine spatial detail. It depends on sampling density and image optics. Insufficient sampling can lose detail and cause aliasing.</p><p><strong>4. Gray-level resolution</strong> is the ability to show small intensity differences. More gray levels give finer brightness steps. Too few levels cause quantization errors and false contours.</p><p><strong>5. Image quality.</strong> Both resolutions affect quality, together with blur and noise. More pixels and bits need more storage. An uncompressed M×N grayscale image with b bits per pixel needs MNb bits.</p>`,
      chinese: `<p><strong>1．采样</strong>把连续的空间坐标变成像素网格，决定在哪些位置记录图像。</p><p><strong>2．量化</strong>把连续强度值映射到有限个灰度级。每像素使用 b 位时，可表示 L=2<sup>b</sup> 个灰度级。</p><p><strong>3．空间分辨率</strong>是显示细小空间细节的能力，取决于采样密度和成像光学系统。采样不足会丢失细节，并可能产生混叠。</p><p><strong>4．灰度分辨率</strong>是显示细小强度差异的能力。灰度级越多，亮度间隔越细；灰度级过少会产生量化误差和假轮廓。</p><p><strong>5．图像质量。</strong> 两种分辨率都会影响质量，模糊和噪声也会影响质量。更多像素和更高位深需要更多存储。M×N、每像素 b 位的未压缩灰度图像需要 MNb 位。</p>`,

    6: {
      english: `<p><strong>1. Simultaneous contrast.</strong> A region's apparent brightness depends on its background. Two patches with the same intensity can look different: the one on a dark background looks brighter, and the one on a bright background looks darker.</p><p><strong>2. Mach bands.</strong> Near an intensity transition, the bright side may look brighter and the dark side darker. We see extra bright and dark bands, although these bands are absent from the actual pixel values.</p><p><strong>Relation and difference.</strong> Both show that perceived brightness depends on local contrast. Simultaneous contrast concerns the background around a region. Mach bands concern the brightness change near a transition.</p>`,
      chinese: `<p><strong>1．同时对比。</strong> 一个区域看起来有多亮，取决于背景。两个强度相同的灰块可能看起来不同：暗背景上的灰块显得更亮，亮背景上的显得更暗。</p><p><strong>2．马赫带。</strong> 在灰度过渡附近，亮侧可能显得更亮，暗侧显得更暗。我们会看到额外的亮带和暗带，尽管实际像素值中没有这些条带。</p><p><strong>联系与区别。</strong> 两者都说明感知亮度受局部对比影响。同时对比关注区域周围的背景；马赫带关注过渡附近的亮度变化。</p>`,

    8: {
      english: `<p>Let r be input intensity and s be output intensity, normalized to [0,1].</p><p><strong>1. Negative:</strong> s=1−r, or s=(L−1)−r for L gray levels. The curve falls from (0,1) to (1,0). It reverses bright and dark areas and reveals light details on dark backgrounds.</p><p><strong>2. Logarithmic:</strong> s=c ln(1+r), c&gt;0. Set c=1/ln 2 for the normalized range. The curve rises and bends downward. It expands low gray levels and compresses high ones. It is useful for dynamic-range compression and spectrum display.</p><p><strong>3. Power-law:</strong> s=cr<sup>γ</sup>, c&gt;0, γ&gt;0. With c=1, γ&lt;1 brightens the image, γ&gt;1 darkens it, and γ=1 leaves it unchanged. The curve is above s=r for γ&lt;1 and below it for γ&gt;1.</p>${curves}<p>Horizontal axis: r. Vertical axis: s. Gamma curves: green γ=0.5, orange γ=2; dashed line s=r.</p>`,
      chinese: `<p>设 r 为输入灰度，s 为输出灰度，两者归一化到 [0,1]。</p><p><strong>1．负片变换：</strong>s=1−r；对于 L 个灰度级，s=(L−1)−r。曲线从 (0,1) 下降到 (1,0)。它反转明暗，可显示暗背景中的浅色细节。</p><p><strong>2．对数变换：</strong>s=c ln(1+r)，c&gt;0。归一化时取 c=1/ln 2。曲线上升且向下弯，扩展低灰度、压缩高灰度，可用于动态范围压缩和频谱显示。</p><p><strong>3．幂律变换：</strong>s=cr<sup>γ</sup>，c&gt;0、γ&gt;0。在 c=1 时，γ&lt;1 使图像变亮，γ&gt;1 使图像变暗，γ=1 保持不变。γ&lt;1 时曲线在 s=r 上方，γ&gt;1 时在其下方。</p>${curves}<p>横轴为 r，纵轴为 s。伽马曲线中，绿色取 γ=0.5，橙色取 γ=2，虚线为 s=r。</p>`,
      scoring: ['三种变换名称及公式','负片的端点和反转效果','对数曲线形状与动态范围压缩','γ 的条件与明暗效果','标明输入输出坐标并画三类曲线']

    9: {
      convention: 'L=8；sₖ=round(7CDF(k))；采用四舍五入，不减 CDF 最小非零值。',
      english: `<p><strong>1. Compute the CDF.</strong> Here L=8. Add the probabilities up to each input level k.</p><div class="model-formula">CDF(k)=Σ<sub>j=0</sub><sup>k</sup>p(r<sub>j</sub>)</div><p><strong>2. Map each gray level.</strong> Use s<sub>k</sub>=round[7CDF(k)]. Round 3.50 up to 4.</p>${equalizationTable}<p><strong>3. Add the probabilities that land together.</strong> The mapping for inputs 0–7 is <strong>[1,2,3,3,4,4,5,7]</strong>. Output 3 receives 0.13+0.05=0.18. Output 4 receives 0.03+0.13=0.16.</p><div class="model-formula"><strong>p<sub>out</sub>(0–7)=[0,0.17,0.12,0.18,0.16,0.15,0,0.22]</strong></div><p>The output probabilities sum to 1.</p>`,
      chinese: `<p><strong>1. 算累计概率。</strong> 本题 L=8。对每个灰度 k，把灰度 0 到 k 的概率加起来。</p><div class="model-formula">CDF(k)=Σ<sub>j=0</sub><sup>k</sup>p(r<sub>j</sub>)</div><p><strong>2. 算灰度映射。</strong> 用 s<sub>k</sub>=round[7CDF(k)]，按四舍五入把 3.50 取为 4。</p>${equalizationTable}<p><strong>3. 合并概率。</strong> 输入灰度 0–7 依次映射为 <strong>[1,2,3,3,4,4,5,7]</strong>。输出 3 的概率是 0.13+0.05=0.18。输出 4 的概率是 0.03+0.13=0.16。</p><div class="model-formula"><strong>p<sub>out</sub>(0–7)=[0,0.17,0.12,0.18,0.16,0.15,0,0.22]</strong></div><p>输出概率总和为 1。</p>`,

      scoring: ['正确圈出中心 146 的九点窗口','明确给出均值核并算得 1302/9','明确给出锐化核并算得 172','正确排序与中值位置','最大 168、中值 146、最小 121']

    12: {
      english: `<p><strong>What it does.</strong> Histogram equalization uses the cumulative distribution function (CDF) to map gray levels. It usually spreads out the gray levels and improves global contrast. For L output levels, use</p><div class="model-formula">p(r<sub>k</sub>)=n<sub>k</sub>/(MN), &nbsp; s<sub>k</sub>=round[(L−1)Σ<sub>j=0</sub><sup>k</sup>p(r<sub>j</sub>)].</div><p><strong>Why the result may not be flat.</strong> The CDF transform gives a uniform distribution in the continuous case. A digital image has a finite number of pixels and discrete gray levels. Rounding can merge several input levels into one output level and leave other levels empty. All pixels with the same input level move together, so their count cannot be split across output levels.</p>`,
      chinese: `<p><strong>怎么做。</strong> 直方图均衡化用累计分布函数（CDF）重新映射灰度。它通常能拉开灰度分布，改善全局对比度。有 L 个输出灰度级时，可用</p><div class="model-formula">p(r<sub>k</sub>)=n<sub>k</sub>/(MN)，&nbsp; s<sub>k</sub>=round[(L−1)Σ<sub>j=0</sub><sup>k</sup>p(r<sub>j</sub>)]。</div><p><strong>为什么不一定平坦。</strong> 在连续模型中，CDF 变换得到均匀分布。数字图像的像素有限，灰度也是离散的。取整可能让几个输入级合并到同一个输出级，也可能让一些输出级为空。同一输入灰度的像素只能一起映射，无法把它们分到几个输出级。</p>`,
      scoring: ['均衡化定义与 CDF 映射公式','说明改善全局对比度的目的','区分连续理论与有限离散图像','取整、多对一合并及空输出级','同灰度像素不能拆分的关键理由']
    },
    13: {
      english: `<p><strong>How they work.</strong> The <strong>mean filter</strong> averages the window values. It is linear. The <strong>median filter</strong> sorts the values and takes the middle one. It is nonlinear.</p><p><strong>Noise and edges.</strong> A few extreme values can pull the mean away from the typical value. The median resists these outliers, so it works well on salt-and-pepper noise when most values in the window are clean. Averaging mixes both sides of an edge. The median usually keeps a sharp step edge clearer.</p><p><strong>Window size.</strong> A large median window may remove thin lines or small objects. For example, [10,10,10,10,255] gives a mean of 59 and a median of 10.</p>`,
      chinese: `<p><strong>做法。</strong> <strong>均值滤波</strong>对窗口灰度求平均，是线性滤波。<strong>中值滤波</strong>把灰度排序，取中间那个值，是非线性滤波。</p><p><strong>噪声和边缘。</strong> 几个极端值就能拉动均值。窗口里大多数像素正常时，中值受极端值影响小，适合去椒盐噪声。均值会混合边缘两侧的灰度。中值通常能更好地保留阶跃边缘。</p><p><strong>窗口大小。</strong> 中值窗口太大会抹掉细线或小目标。例如 [10,10,10,10,255]，均值为 59，中值为 10。</p>`,
      scoring: ['均值求平均、中值排序取中间值','线性与非线性的区别','脉冲或椒盐噪声下的稳健性','通常较好的阶跃边缘保持','细线损失、窗口大小与适用条件']
    },
    14: {
      convention: '与课件一致：正 DFT 带 1/(MN)，同时定义归一化循环卷积，故 G=FH。',
      english: `<p><strong>1. Set up the definitions.</strong> Let f and h be M×N arrays. At fixed (u,v), write E(x,y)=e<sup>−j2π(ux/M+vy/N)</sup>. Each sum runs over one full period. The forward DFT and normalized circular convolution are</p><div class="model-formula">F(u,v)=(1/MN)Σ<sub>x,y</sub> f(x,y)E(x,y),<br>g(x,y)=(1/MN)Σ<sub>m,n</sub> f(m,n)h(x−m,y−n).</div><p>Define H in the same way as F. Take indices modulo M and N.</p><p><strong>2. Substitute and swap the sums.</strong> </p><div class="model-formula">G(u,v)=(1/MN)Σ<sub>x,y</sub>g(x,y)E(x,y)<br>=1/(MN)² Σ<sub>m,n</sub>f(m,n) Σ<sub>x,y</sub>h(x−m,y−n)E(x,y).</div><p><strong>3. Change variables and factor.</strong> Set k=x−m and l=y−n modulo the periods. For fixed m,n, k,l still cover one full period. Since E(k+m,l+n)=E(m,n)E(k,l),</p><div class="model-formula">G(u,v)=[(1/MN)Σ<sub>m,n</sub>f(m,n)E(m,n)]<br>×[(1/MN)Σ<sub>k,l</sub>h(k,l)E(k,l)]<br>=<strong>F(u,v)H(u,v)</strong>.</div><p>With the same forward DFT and ordinary circular convolution, G=MN·FH. For linear convolution, zero-pad to at least (M<sub>f</sub>+M<sub>h</sub>−1)×(N<sub>f</sub>+N<sub>h</sub>−1) and use the chosen normalization.</p>`,
      chinese: `<p><strong>1. 写定义。</strong> 设 f 和 h 是 M×N 数组。固定 (u,v)，记 E(x,y)=e<sup>−j2π(ux/M+vy/N)</sup>。每组求和都遍历一个完整周期。正向 DFT 和归一化循环卷积为</p><div class="model-formula">F(u,v)=(1/MN)Σ<sub>x,y</sub>f(x,y)E(x,y)，<br>g(x,y)=(1/MN)Σ<sub>m,n</sub>f(m,n)h(x−m,y−n)。</div><p>H 的定义与 F 相同。下标按 M、N 取模。</p><p><strong>2. 代入，并交换求和次序。</strong> </p><div class="model-formula">G(u,v)=(1/MN)Σ<sub>x,y</sub>g(x,y)E(x,y)<br>=1/(MN)² Σ<sub>m,n</sub>f(m,n) Σ<sub>x,y</sub>h(x−m,y−n)E(x,y)。</div><p><strong>3. 换元，拆开指数。</strong> 令 k=x−m、l=y−n，按周期取模。对固定的 m、n，k、l 仍遍历一个完整周期。由 E(k+m,l+n)=E(m,n)E(k,l)，得到</p><div class="model-formula">G(u,v)=[(1/MN)Σ<sub>m,n</sub>f(m,n)E(m,n)]<br>×[(1/MN)Σ<sub>k,l</sub>h(k,l)E(k,l)]<br>=<strong>F(u,v)H(u,v)</strong>。</div><p>若正向 DFT 的定义相同、卷积改为普通循环卷积，则 G=MN·FH。求线性卷积时，先把两数组零填充到至少 (M<sub>f</sub>+M<sub>h</sub>−1)×(N<sub>f</sub>+N<sub>h</sub>−1)，再按所选约定处理系数。</p>`,
      scoring: ['写清 DFT 与卷积的归一化定义','卷积代入 DFT 并交换有限求和','k=x−m、l=y−n 的周期换元','指数拆开并识别 F 与 H','明确 G=FH 的约定','说明循环卷积及线性卷积的零填充条件']
    },
    15: {
      english: `<p><strong>Frequency meaning.</strong> Low frequencies describe slow changes such as the background. High frequencies describe fast changes such as edges, fine details, and some noise.</p><p><strong>Low-pass.</strong> It keeps low frequencies and reduces high frequencies. The image becomes smoother, with less high-frequency noise and softer edges. A smaller cutoff D<sub>0</sub> gives stronger smoothing. A larger cutoff keeps more detail.</p><p><strong>High-pass.</strong> It keeps high frequencies and reduces low frequencies. It highlights edges and may amplify noise. A larger cutoff removes a wider low-frequency band. A pure high-pass filter removes the DC component. For sharpening, add the high-pass result back to the original image.</p><p>A sharp cutoff can cause ringing around edges.</p>`,
      chinese: `<p><strong>频率含义。</strong> 低频对应背景等缓慢变化，高频对应边缘、细节和部分噪声等快速变化。</p><p><strong>低通。</strong> 保留低频，削弱高频。图像更平滑，高频噪声减少，边缘也会变模糊。截止频率 D<sub>0</sub> 越小，平滑越强。D<sub>0</sub> 越大，保留的细节越多。</p><p><strong>高通。</strong> 保留高频，削弱低频。它能突出边缘，也可能放大噪声。截止频率越大，被抑制的低频范围越宽。纯高通会去掉直流分量。若要锐化，可把高通结果加回原图。</p><p>截止过于突然，容易在边缘附近产生振铃。</p>`,
      scoring: ['低频与高频的图像含义','低通的平滑、去噪与模糊效果','高通突出边缘但也影响噪声','低通与高通截止参数的不同影响','纯高通与加回原图锐化的区别','突然截止与振铃']

    16: {
      english: `<p><strong>1. Image model.</strong> Write f(x,y)=i(x,y)r(x,y), where i is illumination and r is reflectance. Illumination usually varies slowly. Reflectance often contains higher-frequency edges and texture.</p><p><strong>2. Take the log.</strong> Replace zero values with a small positive floor. Then ln f=ln i+ln r. The logarithm turns the product into a sum.</p><p><strong>3. Filter and transform back.</strong> Take the DFT of ln f and multiply it by H. Use low-frequency gain γ<sub>L</sub>&lt;1 and high-frequency gain γ<sub>H</sub>&gt;1. Take the inverse DFT, undo any centering or padding, and exponentiate.</p><div class="model-formula">ln f → DFT → multiply by H → IDFT → exp</div><p>This reduces lighting variation and enhances details. Adjust the display range if needed.</p>`,
      chinese: `<p><strong>1. 成像模型。</strong> 写成 f(x,y)=i(x,y)r(x,y)，其中 i 是照明，r 是反射。照明通常变化慢。反射中的边缘和纹理通常含有较多高频。</p><p><strong>2. 取对数。</strong> 先用小的正数处理零值，再算 ln f=ln i+ln r。这样乘积变成了和。</p><p><strong>3. 滤波并还原。</strong> 对 ln f 做 DFT，再乘滤波器 H。低频增益 γ<sub>L</sub>&lt;1，高频增益 γ<sub>H</sub>&gt;1。做逆 DFT，撤销用过的中心化或填充，再取指数。</p><div class="model-formula">取对数 → DFT → 乘 H → IDFT → 取指数</div><p>这样可以减弱光照起伏、突出细节。需要时再调整显示范围。</p>`,
      scoring: ['f=i·r 的照明反射模型','低频照明、高频细节的近似假设','ln 将乘积变为和','对数—DFT—乘 H—IDFT—指数的完整顺序','γL<1、γH>1 的增益作用','零值、中心化及动态范围处理条件']
    },
    17: {
      english: `<p><strong>Advantages.</strong> The median filter sorts the window values and takes the middle one. A few extreme values have little effect on the median. This makes it useful for salt-and-pepper noise. It usually keeps step edges clearer because it selects a value from the window instead of averaging both sides. A large window can still erase thin lines.</p><p><strong>Steps.</strong></p><ol><li>Choose an odd window such as 3×3. Set a boundary rule, such as copying edge pixels.</li><li>Center it on each pixel and read the K values from the original image.</li><li>Sort the values and write the (K+1)/2-th value to the output image.</li><li>Move the window and repeat. Read the original image at every step.</li></ol>`,
      chinese: `<p><strong>优点。</strong> 中值滤波把窗口灰度排序，取中间值。少量极端值不容易拉动中值，所以它适合去椒盐噪声。它从窗口里选一个原有灰度，因此通常比均值滤波更能保留阶跃边缘。窗口太大也会抹掉细线。</p><p><strong>步骤。</strong></p><ol><li>选 3×3、5×5 等奇数尺寸窗口，规定边界怎么处理，例如复制边界像素。</li><li>让窗口对准当前像素，从原图读取窗口里的 K 个灰度值。</li><li>从小到大排序，把第 (K+1)/2 个值写到输出图像同一位置。</li><li>移动窗口，逐点重复。每次都从原图读取。</li></ol>`,
      scoring: ['对极端值稳健，适合脉冲或椒盐噪声','较好保边但仍会损失小结构','选奇数窗口与边界规则','取原图邻域并排序','取第 (K+1)/2 个值替换','滑动窗口并使用独立输出数组']
    }

</script><script>/* 完整考试作答范本：按作业要求整理，非教师官方评分答案。 */

  18: {
    english: `<p>Both methods improve image quality or help a specific task.</p>
<p><strong>Enhancement</strong> makes useful details easier to see. It usually needs no degradation model. Examples are histogram equalization and sharpening. We judge it by how the image looks or how well it supports the task.</p>
<p><strong>Restoration</strong> estimates the original image from a degraded one. It uses a degradation model and prior knowledge:</p>
<p class="formula">g=h∗f+n,</p>
<p>where f is the original image, h is the blur function, and n is noise. Examples are inverse filtering and Wiener filtering. We judge it by reconstruction accuracy.</p>

    status: "方法范本与补充算例完整；课堂原题数据仍待补充。",
    english: `<p>First map the output pixel to its input coordinate (x,y). State the coordinate and boundary rules.</p>
<p><strong>Nearest neighbor:</strong> copy the closest pixel:</p>

Bilinear: 0.5×12.5+0.5×32.5=22.5
Nearest neighbor: 30, if half-integer ties round upward.</pre>`,
    chinese: `<p>先把输出像素映射到原图坐标 (x,y)，说明坐标对齐和边界处理规则。</p>
<p><strong>最近邻：</strong>找到最近的原图像素，直接复制它的灰度：</p>
<p class="formula">g(x,y)=f(round(x),round(y))。</p>
<p>等距时需说明如何取整。该方法速度快，保留原有灰度级，但放大后容易出现块状或锯齿。</p>
<p><strong>双线性：</strong>令 x=x₀+α、y=y₀+β，0≤α,β≤1，用周围四点加权：</p>
<p class="formula">g=(1−α)(1−β)f₀₀+α(1−β)f₁₀+(1−α)βf₀₁+αβf₁₁。</p>
<p>四个权重之和为1。可以先沿 x 插值，再沿 y 插值。结果更平滑，但可能使边缘模糊。</p>
<p><strong>补充算例：</strong>四角 f₀₀、f₁₀、f₀₁、f₁₁ 依次为10、20、30、40，求 (0.25,0.5)：</p>
<pre>上边：0.75×10+0.25×20=12.5
下边：0.75×30+0.25×40=32.5
双线性：0.5×12.5+0.5×32.5=22.5
最近邻：半整数向大坐标取整时，结果为30。</pre>`,
    scoring: ["先交代连续坐标映射、边界和取整约定","最近邻：选最近采样点并复制值","双线性：完整四项权重公式、权重和为1","写出逐步代入结果并区分方法效果","明确补充算例不等于课堂原题"]
  },
  21: {
    english: `<p><strong>Light uses additive RGB:</strong> red, green and blue. Their complements are:</p>
<table><thead><tr><th>Primary</th><th>Complement</th></tr></thead><tbody><tr><td>Red</td><td>Cyan</td></tr><tr><td>Green</td><td>Magenta</td></tr><tr><td>Blue</td><td>Yellow</td></tr></tbody></table>
<p>A primary light plus its complement gives <strong>white</strong> at suitable intensities. Cyan=green+blue, magenta=red+blue, and yellow=red+green.</p>
<p><strong>Ideal pigments use subtractive CMY:</strong> cyan, magenta and yellow. They absorb red, green and blue light, respectively. Their complements are red, green and blue.</p>
<p>For pigments, magenta+yellow gives red, cyan+yellow gives green, and cyan+magenta gives blue. Each ideal primary pigment mixed with its complement gives <strong>black</strong>. Real inks are imperfect, so printing also uses black ink K.</p>`,
    chinese: `<p><strong>光采用加色模型 RGB：</strong>三原色为红、绿、蓝，互补色如下：</p>
<table><thead><tr><th>原色</th><th>互补色</th></tr></thead><tbody><tr><td>红</td><td>青</td></tr><tr><td>绿</td><td>品红</td></tr><tr><td>蓝</td><td>黄</td></tr></tbody></table>
<p>原色光与互补色光按适当强度相加，得到<strong>白光</strong>。其中青=绿+蓝，品红=红+蓝，黄=红+绿。</p>
<p><strong>理想颜料采用减色模型 CMY：</strong>三原色为青、品红、黄，分别吸收红、绿、蓝光；其互补色依次为红、绿、蓝。</p>
<p>颜料混合时，品红+黄得到红，青+黄得到绿，青+品红得到蓝。理想原色颜料与其互补色混合得到<strong>黑色</strong>。实际油墨并不理想，因此印刷还会使用黑色墨 K。</p>`,
    scoring: ["光：RGB、加色及两两混合关系","写全红青、绿品红、蓝黄三组互补关系","原色光加互补色光得到白光，注明适当强度","理想颜料：CMY、吸收关系与对应RGB互补色","理想互补颜料混合得到黑色，区别现实油墨"]
  },
  22: {
    english: `<p><strong>RGB</strong> describes a color by red, green and blue components. Each normalized value lies in [0,1]. The colors form a cube: (0,0,0) is black, (1,1,1) is white, and R=G=B gives gray. RGB is useful for cameras and displays.</p>
<p><strong>HSI</strong> means hue, saturation and intensity. H tells the color type; S tells how pure the color is; I tells how bright it is.</p>
<p class="formula">I=(R+G+B)/3,<br>S=1−3min(R,G,B)/(R+G+B), for R+G+B&gt;0.</p>
<p>For RGB=(0.3,0.6,0.9), I=0.6 and S=0.5. Gray has S=0 and no defined hue. Black needs a separate convention.</p>
<p>HSI lets us adjust intensity separately from color. It differs from HSV, whose V is the maximum RGB component.</p>`,
    chinese: `<p><strong>RGB</strong>用红、绿、蓝三个分量表示颜色。归一化后各分量在[0,1]内，构成一个立方体：(0,0,0)为黑，(1,1,1)为白，R=G=B 时为灰色。RGB 适合摄像和显示。</p>
<p><strong>HSI</strong>指色调、饱和度、强度。H 表示是什么颜色，S 表示颜色有多纯，I 表示有多亮。</p>
<p class="formula">I=(R+G+B)/3，<br>S=1−3min(R,G,B)/(R+G+B)，其中 R+G+B&gt;0。</p>
<p>例如 RGB=(0.3,0.6,0.9)，则 I=0.6，S=0.5。灰色的 S=0，色调无定义；黑色需单独约定。</p>
<p>HSI 便于将强度与颜色分开调整。它不等于 HSV，后者的 V 是 RGB 中的最大分量。</p>`,
    scoring: ["RGB三个分量、加色立方体、黑白及灰轴","HSI三个英文全称与各自物理含义","I与S公式及黑色/无彩色色调的特殊情况","RGB与HSI的主要应用及联系","不混淆HSI与HSV/HSL"]
  },
  23: {
    english: `<p>A <strong>pseudo-color image</strong> assigns artificial colors to gray levels. It helps us see value differences, but does not recover the object's true colors.</p>
<p><strong>Intensity slicing:</strong> divide the gray-level range into intervals and give each interval one color. For example, use blue for 0–84, green for 85–169, and red for 170–255. A pixel of intensity 120 appears green.</p>
<p><strong>Gray-level-to-color transformation:</strong> map each gray value r to three components:</p>
<p class="formula">R=T<sub>R</sub>(r), G=T<sub>G</sub>(r), B=T<sub>B</sub>(r).</p>
<p>The mapping can use functions or a lookup table (LUT). Smooth functions give a smooth color scale. Include a color legend to show the value of each color.</p>`,
    chinese: `<p><strong>伪彩色图像</strong>把灰度值按规定映射成人工颜色，帮助观察数值差异，但不恢复物体的真实颜色。</p>
<p><strong>灰度分层：</strong>将灰度范围分成若干区间，每段使用一种颜色。例如0–84用蓝色、85–169用绿色、170–255用红色，灰度120就显示为绿色。</p>
<p><strong>灰度到彩色变换：</strong>把每个灰度 r 映射为三个分量：</p>
<p class="formula">R=T<sub>R</sub>(r)，G=T<sub>G</sub>(r)，B=T<sub>B</sub>(r)。</p>
<p>可用函数或查找表 LUT 实现。平滑变化的函数能得到连续色阶，显示时应附上色标，说明各颜色代表的数值。</p>`,
    scoring: ["定义：人为灰度到颜色映射，说明可视化目的","方法一：灰度分层、区间和赋色步骤","方法二：三通道映射函数或LUT","举一个可操作例子并说明色标","区分伪彩色与恢复真实颜色"]
  },
  25: {
    english: `<p>Let f be the original image, g the reconstructed image, e=g−f, and K=MN the number of pixels.</p>
<p><strong>Objective criteria</strong> measure reconstruction error:</p>
<p class="formula">MSE=(1/K)Σe²,<br>RMSE=√MSE.</p>
<p>Smaller values mean less error. RMSE has the same unit as intensity.</p>
<p>Using original-image energy, define:</p>
<p class="formula">SNR<sub>ms</sub>=Σf²/Σe²,<br>SNR<sub>rms</sub>=√SNR<sub>ms</sub>,<br>SNR<sub>dB</sub>=10log₁₀SNR<sub>ms</sub>=20log₁₀SNR<sub>rms</sub>.</p>
<p>Some textbooks use Σg² in the numerator. State the convention.</p>
<p class="formula">PSNR=10log₁₀(MAX²/MSE) dB.</p>
<p>MAX=255 for 8-bit images. Larger SNR or PSNR usually means less distortion. When MSE=0, PSNR=+∞.</p>
<p><strong>Subjective criteria</strong> ask viewers to rate image quality under fixed conditions. They reflect visual effects that pixel errors may miss. Compression ratio and entropy measure coding, not fidelity.</p>`,
    chinese: `<p>设 f 为原图，g 为重建图，误差 e=g−f，像素总数 K=MN。</p>
<p><strong>客观准则</strong>用数值衡量重建误差：</p>
<p class="formula">MSE=(1/K)Σe²，<br>RMSE=√MSE。</p>
<p>二者越小，误差越小。RMSE 与灰度值的单位相同。</p>
<p>采用原图能量时，信噪比为：</p>
<p class="formula">SNR<sub>ms</sub>=Σf²/Σe²，<br>SNR<sub>rms</sub>=√SNR<sub>ms</sub>，<br>SNR<sub>dB</sub>=10log₁₀SNR<sub>ms</sub>=20log₁₀SNR<sub>rms</sub>。</p>
<p>有些教材用 Σg² 作分子，计算时需说明所用约定。</p>
<p class="formula">PSNR=10log₁₀(MAX²/MSE) dB。</p>
<p>8位图像取 MAX=255。SNR、PSNR 越大，通常失真越小。MSE=0 时，PSNR=+∞。</p>
<p><strong>主观准则</strong>让观察者在固定条件下给图像质量评分，反映数值误差未必能说明的视觉效果。压缩率和熵衡量编码，不是保真度指标。</p>`,
    scoring: ["定义原图、重建图及误差","MSE、RMSE完整公式及大小意义","区分SNR能量比、RMS比与dB表达，注明分子约定","PSNR公式、MAX与MSE=0特殊情况","主观评价方法与客观指标的局限"]
  },
  26: {
    english: `<p><strong>Huffman coding</strong> is lossless. It gives short codes to common symbols and long codes to rare symbols. No codeword is the prefix of another, so decoding is clear.</p>
<p><strong>Steps:</strong> repeatedly merge the two smallest probabilities and replace them by their sum, until one node remains. Give the two branches labels 0 and 1. Read each code from root to leaf. This gives an optimal binary prefix code.</p>
<p>For probabilities pᵢ and code lengths lᵢ:</p>
<p class="formula">Entropy: H=−Σpᵢlog₂pᵢ (average information),<br>Average length: L̄=Σpᵢlᵢ (actual bits/symbol),<br>Efficiency: η=H/L̄,<br>Relative redundancy: R=1−η.</p>
<p>The excess length L̄−H is measured in bits/symbol, not percent.</p>
<p><strong>Example:</strong> for A, B, C, D with probabilities 0.4, 0.3, 0.2, 0.1:</p>
<pre>Merge: 0.1+0.2=0.3; 0.3+0.3=0.6; 0.4+0.6=1.
Codes: A=0, B=10, C=110, D=111.
L̄=0.4×1+0.3×2+0.2×3+0.1×3=1.9
H≈1.84644 bits/symbol
η≈97.18%; R≈2.82%</pre>
<p>Swapping branch labels gives other valid codewords.</p>`,
    chinese: `<p><strong>Huffman 编码</strong>是一种无损编码：常见符号用短码，少见符号用长码。任何码字都不是另一个码字的前缀，因此可以明确解码。</p>
<p><strong>步骤：</strong>每次合并概率最小的两个节点，新节点概率为二者之和，直到只剩根节点；给每处分叉的两条边标0、1，从根到叶读取码字。由此得到最优二进制前缀码。</p>
<p>设符号概率为 pᵢ，码长为 lᵢ：</p>
<p class="formula">熵 H=−Σpᵢlog₂pᵢ：平均信息量，<br>平均码长 L̄=Σpᵢlᵢ：实际平均比特数，<br>效率 η=H/L̄，<br>相对冗余 R=1−η。</p>
<p>额外码长 L̄−H 的单位是 bit/符号，不是百分比。</p>
<p><strong>算例：</strong>概率为0.4、0.3、0.2、0.1：</p>
<pre>合并：0.1+0.2=0.3；0.3+0.3=0.6；0.4+0.6=1。
码字：A=0，B=10，C=110，D=111。
L̄=0.4×1+0.3×2+0.2×3+0.1×3=1.9
H≈1.84644 bit/符号
η≈97.18%；R≈2.82%</pre>
<p>交换分支上的0、1，可得到其他合法码字。</p>`,
    scoring: ["变长、无损、前缀无歧义三项核心性质","完整写出最小两概率合并与根到叶赋码算法","熵、平均码长、效率、冗余的定义公式及单位","概率例题的树构造、码字与指标一致","注明相对冗余与超额比特的区别、码字不唯一"]
  },
  27: {
    english: `<p><strong>Predictive coding</strong> uses the similarity of neighboring pixels. Predict the current pixel from earlier reconstructed pixels, then encode the prediction error:</p>
<p class="formula">e=f−f<sub>p</sub>,</p>
<p>where f is the actual value and f<sub>p</sub> is the prediction. The decoder uses the same predictor and adds the decoded error to recover the pixel. Both sides need the same scan order, starting values and boundary rules.</p>
<p>A good predictor makes errors cluster near zero. Their entropy is often lower, so entropy coding needs fewer bits. For example:</p>
<pre>Pixels: 100, 101, 100, 102
Store: first value 100; errors 1, −1, 2.</pre>
<p>Exact errors allow <strong>lossless</strong> coding. Quantized errors usually give <strong>lossy</strong> coding. Both encoder and decoder must predict from the same reconstructed samples.</p>`,
    chinese: `<p><strong>预测编码</strong>利用相邻像素的相似性。先用前面已重建的像素预测当前值，再编码预测误差：</p>
<p class="formula">e=f−f<sub>p</sub>，</p>
<p>其中 f 是真实值，f<sub>p</sub> 是预测值。解码端使用相同预测器，把解码误差加到预测值上，恢复像素。双方需采用相同的扫描顺序、初值和边界规则。</p>
<p>预测准确时，误差集中在0附近，熵通常更低，因此熵编码需要的比特更少。例如：</p>
<pre>原像素：100、101、100、102
记录：首值100；后续误差1、−1、2。</pre>
<p>精确编码误差可实现<strong>无损</strong>；量化误差通常产生<strong>有损</strong>编码。编码端与解码端都应使用相同的重建样本进行预测。</p>`,
    scoring: ["利用邻点相关性与预测器","残差公式及编码、解码相加重建流程","用近零集中和更低统计冗余解释压缩效率","量化可选，正确区分有损与无损","双方使用一致重建样本预测，交代边界和初值"]
  },
  28: {
    english: `<p>Let R be the whole image and P be the chosen homogeneity rule. The nonempty regions R₁,…,Rₙ should satisfy five conditions.</p>
<p><strong>1. Coverage:</strong> ⋃Rᵢ=R. Every pixel belongs to a region.</p>
<p><strong>2. Connectivity:</strong> each Rᵢ is connected under the chosen 4- or 8-adjacency rule.</p>
<p><strong>3. No overlap:</strong> Rᵢ∩Rⱼ=∅ for i≠j. A pixel belongs to only one region.</p>
<p><strong>4. Internal homogeneity:</strong> P(Rᵢ)=TRUE. Each region meets the gray-level, color or texture rule.</p>
<p><strong>5. Separate neighbors:</strong> P(Rᵢ∪Rⱼ)=FALSE for adjacent regions. They cannot be merged while keeping the same rule.</p>
<p>Connectivity concerns position; homogeneity concerns pixel features.</p>`,
    chinese: `<p>设 R 为整幅图像，P 为选定的同质性准则。非空区域 R₁、…、Rₙ 应满足五个条件。</p>
<p><strong>1. 完整覆盖：</strong>⋃Rᵢ=R。每个像素都属于某一区域。</p>
<p><strong>2. 区域连通：</strong>每个 Rᵢ 在规定的4邻接或8邻接下连通。</p>
<p><strong>3. 互不重叠：</strong>i≠j 时，Rᵢ∩Rⱼ=∅。一个像素只能属于一个区域。</p>
<p><strong>4. 内部同质：</strong>P(Rᵢ)=TRUE。区域内部满足规定的灰度、颜色或纹理准则。</p>
<p><strong>5. 相邻区域不能再合并：</strong>相邻的 Rᵢ、Rⱼ 满足 P(Rᵢ∪Rⱼ)=FALSE，合并后不再同质。</p>
<p>连通约束空间位置，同质约束像素特征。</p>`,
    scoring: ["覆盖：并集等于完整图像","每个区域在指定邻接下连通","互斥：不同区域交集为空","区域自身满足同质性谓词P","相邻区域的并集不满足P，区别连通与同质"]
  },
  29: {
    english: `<p>Edges are places where intensity changes quickly. Derivatives give strong responses there and near-zero responses in flat areas.</p>
<p><strong>First order:</strong> use the gradient ∇f=(Gₓ,Gᵧ). Its magnitude gives edge strength; its direction is normal to the edge:</p>
<p class="formula">|∇f|=√(Gₓ²+Gᵧ²)≈|Gₓ|+|Gᵧ|.</p>
<p>A pair of Sobel masks is:</p>
<pre>Gx = −1  0  1       Gy = −1 −2 −1
     −2  0  2             0  0  0
     −1  0  1             1  2  1</pre>
<p>Combine both responses and threshold the magnitude.</p>
<p><strong>Second order:</strong> use the Laplacian:</p>
<p class="formula">∇²f=∂²f/∂x²+∂²f/∂y².</p>
<pre> 0  1  0
 1 −4  1
 0  1  0</pre>
<p>For a smoothed step edge, look for a strong sign change across zero. Smooth first because derivatives amplify noise. A zero alone is not an edge: flat areas can also be zero. Reversing a mask's sign keeps magnitudes and zero-crossing locations unchanged.</p>`,
    chinese: `<p>边缘处灰度变化快，微分响应强；平坦区域灰度变化小，微分响应接近0。</p>
<p><strong>一阶微分：</strong>用梯度 ∇f=(Gₓ,Gᵧ)。幅值表示边缘强度，方向与边缘大致垂直：</p>
<p class="formula">|∇f|=√(Gₓ²+Gᵧ²)≈|Gₓ|+|Gᵧ|。</p>
<p>可用一对 Sobel 模板：</p>
<pre>Gx = −1  0  1       Gy = −1 −2 −1
     −2  0  2             0  0  0
     −1  0  1             1  2  1</pre>
<p>合成两个响应，再按梯度幅值设阈值检测边缘。</p>
<p><strong>二阶微分：</strong>用拉普拉斯算子：</p>
<p class="formula">∇²f=∂²f/∂x²+∂²f/∂y²。</p>
<pre> 0  1  0
 1 −4  1
 0  1  0</pre>
<p>对于平滑阶跃边缘，寻找响应明显变号的过零点。微分会放大噪声，因此通常先平滑。不能只凭响应为0就判为边缘，因为平坦区也可能为0。模板整体变号不改变幅值和过零位置。</p>`,
    scoring: ["从边缘灰度快速变化解释微分依据","一阶梯度分量、幅值和方向含义","给出一对完整Sobel模板及合成方法","二阶拉普拉斯公式、完整模板和过零依据","噪声敏感、先平滑及过零幅度条件"]
  },
  30: {
    english: `<p><strong>Region growing</strong> starts from seed pixels and adds similar neighbors until no more pixels can be added.</p>
<p><strong>Steps:</strong> choose seeds and a 4- or 8-neighbor rule. Set a similarity test, such as |f(p)−μ<sub>R</sub>|≤T. Check unassigned neighbors, add those that pass, update the region mean μ<sub>R</sub>, and check the new neighbors. Stop when no neighbor passes.</p>
<p><strong>Practical issues:</strong> choose suitable seeds, features and thresholds. State whether similarity is measured against the seed or the current region. Resolve conflicts between growing regions. Noise and weak boundaries can cause gaps or leakage; smoothing or edge limits may help. Also handle unassigned pixels and small regions.</p>
<p>Both similarity and connectivity are required.</p>`,
    chinese: `<p><strong>区域生长</strong>从种子像素出发，逐步加入相似邻点，直到区域不能继续扩大。</p>
<p><strong>步骤：</strong>选择种子，规定4邻域或8邻域，设置相似性判据，例如 |f(p)−μ<sub>R</sub>|≤T。检查未分配邻点，将合格者加入区域，更新区域均值 μ<sub>R</sub>，再检查新邻点；没有合格邻点时停止。</p>

function transmissionMetrics(width,height,kbaud){
 if(!Number.isInteger(width)||!Number.isInteger(height)||width<1||height<1||width>16384||height>16384||!Number.isFinite(kbaud)||kbaud<=0||kbaud>1e6)throw Error('图像宽高需为 1–16384 的整数，速率需为正数。');
 const pixels=width*height,payload=pixels*8,overhead=pixels*2,total=payload+overhead,rate=kbaud*1000;
 return {pixels,payload,overhead,total,rate,seconds:total/rate};
}
function imageHuffmanMetrics(counts){
 if(counts.length!==4||counts.some(n=>!Number.isInteger(n)||n<=0||n>1e6))throw Error('请依次输入四个正整数频次，单项不超过 1000000。');
 const gray=[21,95,169,243],total=counts.reduce((s,n)=>s+n,0),queue=counts.map((n,i)=>({weight:n,order:i,index:i})),merges=[];
 let order=4;
 while(queue.length>1){queue.sort((a,b)=>a.weight-b.weight||a.order-b.order);const left=queue.shift(),right=queue.shift();merges.push([left.weight,right.weight,left.weight+right.weight]);queue.push({weight:left.weight+right.weight,order:order++,left,right});}
 const codes=[];
 function walk(node,code){if(node.index!==undefined)codes[node.index]=code;else{walk(node.left,code+'0');walk(node.right,code+'1');}}
 walk(queue[0],'');
 const rows=counts.map((count,i)=>({gray:gray[i],count,p:count/total,code:codes[i],length:codes[i].length}));
 const entropy=-rows.reduce((s,r)=>s+r.p*Math.log2(r.p),0),bits=rows.reduce((s,r)=>s+r.count*r.length,0),average=bits/total,efficiency=entropy/average;
 return {rows,merges,total,entropy,bits,average,efficiency,redundancy:1-efficiency,rawBits:8*total,compression:8*total/bits,saving:1-bits/(8*total),packedBytes:Math.ceil(bits/8)};
}
function transmissionLabHTML(){return `<div class="lab-grid"><article class="study-card"><h2 style="font-size:18px">教材 2.9：数据位与传输位</h2><p class="info-text">原题为 1024×1024、256 灰度级。每像素占一个 8 位字节；每字节另加 1 起始位与 1 停止位。每符号 1 bit，K=1000。可改宽高和速率练习。</p><div class="input-row"><label class="field">宽（像素）<input id="tx-width" class="lab-input" type="number" min="1" max="16384" value="1024"></label><label class="field">高（像素）<input id="tx-height" class="lab-input" type="number" min="1" max="16384" value="1024"></label><label class="field">速率（Kbaud）<input id="tx-rate" class="lab-input" type="number" min="0.001" step="any" value="56"></label></div><label class="field">先预测总传输位数与时间<input id="lab-prediction" class="lab-input" placeholder="有多少字节？每个字节实际要传几位？"></label>${button('核对数据量、开销与时间','run-lab')}</article><article class="study-card"><p class="info-text">按“灰度级 → 每像素数据位 → 数据字节数 → 每字节传输位数 → 总传输位数 ÷ bit/s”的顺序计算。</p><p class="info-text">baud 的单位是符号/秒；只有在本题每符号 1 bit 的条件下，它的数值才等于 bit/s。注意 K=1000。</p><div id="lab-result" aria-live="polite"></div><a class="answer-link" href="#answer/1">查看第 1 题完整中英文作答 ↗</a></article></div>`;}

}
function imageHuffmanLabHTML(){return `<article class="study-card"><h2 style="font-size:18px">教材 8.9：从真实图像数到码字</h2>${Q.find(q=>q.id===24)?.problemHtml||''}<p class="info-text">原图四个灰度 21、95、169、243 的频次可先逐行统计；下面可改频次，比较熵、码长与压缩比。</p><label class="field">依次输入 21、95、169、243 的频次<input id="huffman-counts" class="lab-input" value="12 4 4 12"></label><label class="field">先预测熵、编码总位数或压缩比<input id="lab-prediction" class="lab-input" placeholder="先写出概率，合并两个最小的频次"></label>${button('展开码表、熵与压缩指标','run-lab')}<div id="lab-result" aria-live="polite"></div><a class="answer-link" href="#answer/24">查看第 24 题完整中英文作答 ↗</a></article>`;}

 return `<div class="example"><p>逐次合并最小频次：${m.merges.map(([a,b,c])=>`${a}+${b}=${c}`).join('；')}。</p><table><thead><tr><th>灰度</th><th>频次</th><th>概率</th><th>码字</th><th>码长</th></tr></thead><tbody>${m.rows.map(r=>`<tr><td>${r.gray}</td><td>${r.count}</td><td>${r.p.toFixed(4)}</td><td><code>${r.code}</code></td><td>${r.length}</td></tr>`).join('')}</tbody></table><p>像素数 N = <b>${m.total}</b><br>熵 H = −Σ p log₂p = <b>${m.entropy.toFixed(6)} bit/像素</b><br>平均码长 L̄ = Σ pℓ = <b>${m.average.toFixed(6)} bit/像素</b><br>编码总位数 B = Σ nℓ = <b>${m.bits} bit</b><br>原图 B₀ = ${m.total}×8 = <b>${m.rawBits} bit</b><br>压缩比 Cᵣ = B₀/B ≈ <b>${m.compression.toFixed(4)}∶1</b><br>编码效率 η = H/L̄ ≈ <b>${(m.efficiency*100).toFixed(4)}%</b><br>相对编码冗余 1−η ≈ <b>${(m.redundancy*100).toFixed(4)}%</b><br>存储节省比例 1−B/B₀ ≈ <b>${(m.saving*100).toFixed(4)}%</b></p><p>0/1 分配和并列节点选择可以不同，码字与范本不必逐个相同；需满足前缀条件且码长与树一致。这里按连续比特流统计，不计码表或头部；若只在整幅图末尾补齐到字节，则需 ${m.packedBytes} 字节。</p></div>`;
}
